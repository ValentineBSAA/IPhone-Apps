name: LAST SEEN — native iOS 16 horror game

on:
  workflow_dispatch:
  push:
    branches:
      - feature/last-seen-ios16
      - feature/last-seen-story-photos-voice-prep
      - feature/last-seen-living-phone
      - feature/last-seen-phone-feedback-v1-1
      - fix/last-seen-1-1-1-contact-identity
      - fix/last-seen-1-1-2-real-phone
      - feature/last-seen-phone-lab
      - feature/last-seen-setup-restore
      - feature/last-seen-biometric-unlock
      - feature/last-seen-native-phone-polish
      - feature/last-seen-recovery-security
      - feature/last-seen-opening-experience
      - feature/last-seen-native-edge-gestures
      - feature/last-seen-respring-polish
      - feature/last-seen-cinematic-jailbreak
      - feature/last-seen-terminal-focus
      - feature/last-seen-relay-ecosystem
      - feature/last-seen-welcome-briefing
      - feature/last-seen-phone-feedback
      - feature/last-seen-custom-phone-sounds
      - feature/last-seen-nora-photo-vault
      - feature/last-seen-foundation
      - feature/last-seen-build27-noras-world
    paths:
      - 'LastSeen/**'
      - '.github/workflows/last-seen-ios16.yml'
  pull_request:
    paths:
      - 'LastSeen/**'
      - '.github/workflows/last-seen-ios16.yml'

permissions:
  contents: read

concurrency:
  group: last-seen-ios16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Native iPhone build, simulator tests, unsigned IPA
    runs-on: macos-15
    timeout-minutes: 55
    defaults:
      run:
        working-directory: LastSeen
    steps:
      - name: Checkout game source
        uses: actions/checkout@v4

      - name: Verify release and timing contracts before compilation
        run: python3 Tools/verify_release_contract.py

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Parse Swift sources before downloading build resources
        run: |
          set -euo pipefail
          find LastSeenApp Tests UITests -name '*.swift' -print0 | xargs -0 swiftc -frontend -parse

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate original App Store icon
        run: |
          set -euo pipefail
          swift Tools/make_icon.swift
          test -s LastSeenApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Download the ten uploaded contact photos from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download Photos-1 \
            --repo ValentineBSAA/IPhone-Apps \
            --pattern 'Last-Seen-10-Contact-Portraits.zip' \
            --dir . --clobber
          mv Last-Seen-10-Contact-Portraits.zip ContactPhotos.zip
          test "$(stat -f '%z' ContactPhotos.zip)" -ge 900000
          unzip -tq ContactPhotos.zip

      - name: Import all ten character photos into native iOS asset catalog
        run: |
          set -euo pipefail
          python3 Tools/import_contacts.py --zip ContactPhotos.zip --required
          test "$(find LastSeenApp/Assets.xcassets -maxdepth 1 -type d -name 'Contact_*.imageset' | wc -l | tr -d ' ')" = "12"
          for asset in Contact_Nora_01 Contact_Nora_02 Contact_Nora_03 Contact_Nora_04 \
                       Contact_Eli_01 Contact_Eli_02 Contact_Eli_03 \
                       Contact_Unit7_01 Contact_Unit7_02 Contact_Unit7_03; do
            test -s "LastSeenApp/Assets.xcassets/${asset}.imageset/portrait.jpg"
          done

      - name: Download all ten uploaded story photographs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download Photos-1 \
            --repo ValentineBSAA/IPhone-Apps \
            --pattern 'LAST_SEEN_10_Story_Photos.zip' \
            --dir . --clobber
          mv LAST_SEEN_10_Story_Photos.zip StoryPhotos.zip
          unzip -tq StoryPhotos.zip
          python3 Tools/import_story_photos.py --zip StoryPhotos.zip --required
          test "$(find LastSeenApp/Assets.xcassets -maxdepth 1 -type d -name 'Story_*.imageset' | wc -l | tr -d ' ')" = "10"
          for asset in Story_01_Nora_Hallway Story_02_Elevator_Reflection \
                       Story_03_Nora_Front_Door Story_04_Impossible_Hallway \
                       Story_05_Eli_Maintenance Story_06_Inside_Elevator \
                       Story_07_Building_Records Story_08_Unknown_Your_Door \
                       Story_09_Stairwell Story_10_Final_Reveal; do
            test -s "LastSeenApp/Assets.xcassets/${asset}.imageset/photo.jpg"
          done

      - name: Import all twenty approved icons and original respring sounds
        run: |
          set -euo pipefail
          python3 Tools/import_approved_icons.py
          python3 Tools/make_respring_audio.py
          test "$(find LastSeenApp/Assets.xcassets -maxdepth 1 -type d -name 'Opening_*.imageset' | wc -l | tr -d ' ')" = "10"
          test "$(find LastSeenApp/Assets.xcassets -maxdepth 1 -type d -name 'Theme_*.imageset' | wc -l | tr -d ' ')" = "10"

      - name: Import eleven original phone sounds from release L1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download L1 --repo ValentineBSAA/IPhone-Apps --pattern 'Last.Seen.Sounds.zip' --dir . --clobber
          python3 Tools/import_phone_sounds.py --zip Last.Seen.Sounds.zip
          gh release download L1 --repo ValentineBSAA/IPhone-Apps --pattern 'Extra.phone.sounds.V1.zip' --dir . --clobber
          python3 Tools/import_extra_phone_sounds.py --zip Extra.phone.sounds.V1.zip

      - name: Import and verify all sixteen approved Nora assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download L1 --repo ValentineBSAA/IPhone-Apps --pattern 'Last-Seen-Nora-Photo-Pack.zip' --dir . --clobber
          python3 Tools/import_nora_photos.py --zip Last-Seen-Nora-Photo-Pack.zip
          for asset in Nora_Profile Photo_Locked_Texture Nora_Collage_01 Nora_Collage_02; do
            test -s "LastSeenApp/Assets.xcassets/${asset}.imageset/photo.jpg"
          done
          for index in $(seq -w 1 12); do
            test -s "LastSeenApp/Assets.xcassets/Nora_Photo_${index}.imageset/photo.jpg"
          done
          for index in 01 02 03 04; do
            cmp "LastSeenApp/Assets.xcassets/Contact_Nora_${index}.imageset/portrait.jpg" "LastSeenApp/Assets.xcassets/Nora_Profile.imageset/photo.jpg"
          done

      - name: Import verified LumaOS Foundation artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download L1 --repo ValentineBSAA/IPhone-Apps --pattern 'Last-Seen-LumaOS-Foundation-Assets.zip' --dir . --clobber
          python3 Tools/import_foundation_assets.py --zip Last-Seen-LumaOS-Foundation-Assets.zip

      - name: Import verified jailbreak expansion icons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download L1 --repo ValentineBSAA/IPhone-Apps --pattern 'Last-Seen-Build27-Jailbreak-Icons.zip' --dir . --clobber
          gh release download L1 --repo ValentineBSAA/IPhone-Apps --pattern 'Last-Seen-Build27-Contact-Photos.zip' --dir . --clobber
          python3 Tools/import_build27_art.py
          gh release download L1 --repo ValentineBSAA/IPhone-Apps --pattern 'Last-Seen-Build27-Recovered-Images.zip' --dir . --clobber
          python3 Tools/import_recovered_art.py
          gh release download L1 --repo ValentineBSAA/IPhone-Apps --pattern 'Last-Seen-World-Photos-Expansion-01.zip' --dir . --clobber
          python3 Tools/verify_world_photo_intake.py
          gh release download L1 --repo ValentineBSAA/IPhone-Apps --pattern 'Last-Seen-Connected-World-Icons-01.zip' --dir . --clobber
          gh release download L1 --repo ValentineBSAA/IPhone-Apps --pattern 'Last-Seen-World-Documents-01.zip' --dir . --clobber
          python3 Tools/import_connected_world.py

      - name: Import approved HavenWatch V2 artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download L1 --repo ValentineBSAA/IPhone-Apps --pattern 'LAST_SEEN_HavenWatch_Version_Two_Approved.zip' --dir . --clobber
          python3 Tools/import_havenwatch.py --zip LAST_SEEN_HavenWatch_Version_Two_Approved.zip

      - name: Import approved Dayblink and Motionwell icons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download L1 --repo ValentineBSAA/IPhone-Apps --pattern 'LAST_SEEN_Social_Icons_Approved.zip' --dir . --clobber
          python3 Tools/import_social_icons.py --zip LAST_SEEN_Social_Icons_Approved.zip

      - name: Import approved Relay Support knowledge and artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download L1 --repo ValentineBSAA/IPhone-Apps --pattern 'LastSeen_Build32_RelaySupport_ContentPack_v1.zip' --dir . --clobber
          python3 Tools/import_relay_support.py --zip LastSeen_Build32_RelaySupport_ContentPack_v1.zip

      - name: Import approved VEIL icon and recovered archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download L1 --repo ValentineBSAA/IPhone-Apps --pattern 'LAST_SEEN_VEIL_Nora_Approved_Assets_v1.zip' --dir . --clobber
          python3 Tools/import_veil_assets.py --zip LAST_SEEN_VEIL_Nora_Approved_Assets_v1.zip

      - name: Import verified community reserve portraits and hobby avatars
        run: |
          set -euo pipefail
          python3 Tools/import_community_reserves.py

      - name: Encode and verify original Motionwell photo essays
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || brew install ffmpeg
          python3 Tools/make_motionwell_media.py

      - name: Verify imported photo inventory before native compilation
        run: python3 Tools/verify_imported_photo_contract.py

      - name: Generate iOS 16 Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Build native iPhone release app (no code signing)
        run: |
          set -euo pipefail
          xcodebuild -project LastSeen.xcodeproj \
            -scheme LastSeen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify exact minimum iOS version and bundled app icon
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/LastSeen.app"
          test -d "$APP"
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          echo "Compiled MinimumOSVersion: $MIN_OS"
          test "$MIN_OS" = "16.0"
          test -f "$APP/Assets.car"
          test -s "$APP/RespringDown.wav"
          test -s "$APP/RespringUp.wav"
          test -s "$APP/UserspaceDown.wav"
          test -s "$APP/UserspaceUp.wav"
          python3 Tools/import_phone_sounds.py --verify-bundle "$APP"
          python3 Tools/import_extra_phone_sounds.py --verify-bundle "$APP"
          MARKETING_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "Actual app version: $MARKETING_VERSION ($BUILD_NUMBER)"
          test "$MARKETING_VERSION" = "1.9.0"
          test "$BUILD_NUMBER" = "32"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSFaceIDUsageDescription' "$APP/Info.plist")"
          test "$BUNDLE_ID" = "com.valentinebsaa.lastseen.horror"
          test -s "LastSeenApp/Assets.xcassets/Contact_Maya.imageset/photo.jpg"
          test -s "LastSeenApp/Assets.xcassets/Contact_Denise.imageset/photo.jpg"
          test "$(find LastSeenApp/Assets.xcassets -maxdepth 1 -type d -name 'Contact_*.imageset' | wc -l | tr -d ' ')" = "12"
          python3 Tools/verify_device_assets.py --app "$APP"
          xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" > device-asset-catalog.json
          python3 Tools/verify_device_assets.py --catalog device-asset-catalog.json

      - name: Run story-engine, Phone Lab, restore, security and opening tests on iPhone simulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next((x["udid"] for devices in d["devices"].values() for x in devices if x.get("isAvailable") and x.get("name","").startswith("iPhone")),""))')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::error::iPhone simulator unavailable. Tests must not be silently skipped."
            exit 1
          fi
          xcodebuild -project LastSeen.xcodeproj \
            -scheme LastSeen \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build-simulator \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Capture actual simulator permission screen
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next((x["udid"] for devices in d["devices"].values() for x in devices if x.get("isAvailable") and x.get("name","").startswith("iPhone")),""))')"
          test -n "$SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" build-simulator/Build/Products/Debug-iphonesimulator/LastSeen.app
          xcrun simctl launch "$SIMULATOR_ID" com.valentinebsaa.lastseen.horror
          sleep 4
          mkdir -p dist
          xcrun simctl io "$SIMULATOR_ID" screenshot dist/last-seen-permissions-v1.9.0.png
          test -s dist/last-seen-permissions-v1.9.0.png

      - name: Upload visual UI verification screenshot
        uses: actions/upload-artifact@v4
        with:
          name: LAST-SEEN-v1.9.0-permissions-screen-simulator
          path: LastSeen/dist/last-seen-permissions-v1.9.0.png
          if-no-files-found: error
          retention-days: 14

      - name: Package unsigned iPhone IPA
        run: |
          set -euo pipefail
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/LastSeen.app dist/Payload/
          (
            cd dist
            zip -qr Last-Seen-v1.9.0-iOS16-unsigned.ipa Payload
          )
          test -s dist/Last-Seen-v1.9.0-iOS16-unsigned.ipa
          python3 Tools/verify_device_assets.py --ipa dist/Last-Seen-v1.9.0-iOS16-unsigned.ipa --app build/Build/Products/Release-iphoneos/LastSeen.app

      - name: Publish unsigned IPA for user-side installation
        uses: actions/upload-artifact@v4
        with:
          name: LAST-SEEN-v1.9.0-iOS16-unsigned
          path: LastSeen/dist/Last-Seen-v1.9.0-iOS16-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Keep simulator test results for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAST-SEEN-simulator-results
          path: LastSeen/build-simulator/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
