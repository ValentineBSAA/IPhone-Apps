name: Berry Berry Blast 0.5.12 Reward Garden Native Build (art patched after export)
on:
  push:
    branches: [feature/berry-berry-blast-0512-reward-garden-test]
    paths:
      - 'StrawberryShortcakeBlockBlast/**'
      - '.github/workflows/berry-0512-reward-garden-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: berry-0512-rewards
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: StrawberryShortcakeBlockBlast
    steps:
      - name: Checkout revision
        uses: actions/checkout@v4
      - name: Validate Swift 5 source, iOS 16 and original audio
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/verify_ios16_source.py
          python3 Tools/check_ios16_compat.py
          python3 Tools/verify_audio_build2.py
          find BerryBlockBlast Tests -name '*.swift' -type f -print0 |
            xargs -0 xcrun swiftc -frontend -parse -swift-version 5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore previous production artwork
        run: |
          set -euo pipefail
          python3 Tools/install_art510.py
          xcodegen generate --spec project.yml
      - name: Build simulator app and XCTest bundle
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project BerryBlockBlast.xcodeproj -scheme BerryBlockBlast \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/Sim CODE_SIGNING_ALLOWED=NO build
      - name: Compile real iPhone iOS 16 app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project BerryBlockBlast.xcodeproj -scheme BerryBlockBlast \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath .build/Device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for local approved artwork integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/Payload
          cp -R .build/Device/Build/Products/Release-iphoneos/BerryBlockBlast.app dist/Payload/
          (cd dist && zip -qr Berry-Berry-Blast-v0.5.12-build1-BASE-unsigned.ipa Payload)
          python3 Tools/verify_audio_build2.py --ipa dist/Berry-Berry-Blast-v0.5.12-build1-BASE-unsigned.ipa
          unzip -t dist/Berry-Berry-Blast-v0.5.12-build1-BASE-unsigned.ipa | tail -2
      - name: Upload native app base for local exact PNG insertion
        uses: actions/upload-artifact@v4
        with:
          name: Berry-Berry-Blast-v0.5.12-build1-BASE-native-IPA
          path: StrawberryShortcakeBlockBlast/dist/Berry-Berry-Blast-v0.5.12-build1-BASE-unsigned.ipa
          retention-days: 14
