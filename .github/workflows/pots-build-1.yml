name: POTS & Posies | v0.3.0 Next Milestone Baseline iOS 16

on:
  workflow_dispatch:
  push:
    paths:
      - "POTSTracker/**"
      - ".github/workflows/pots-build-1.yml"

concurrency:
  group: pots-posies-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Use GitHub's supported Intel pool to avoid macos-15 ARM runner acquisition
    # failures (queued 15 minutes with no runner and zero build steps).
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Require all 13 approved custom icons
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f POTSTracker/Resources/Icons/00_App_Icon.png ]; then
            if [ -f POTSTracker/assets/approved-icon-pack.zip ]; then
              python3 POTSTracker/tools/import_icons.py POTSTracker/assets/approved-icon-pack.zip --repo-root . --replace
            else
              echo "::error::Missing approved POTS icon artwork. Upload approved-icon-pack.zip to POTSTracker/assets/ on GitHub, then rerun."
              exit 1
            fi
          fi
          python3 POTSTracker/tools/import_icons.py --help >/dev/null

      - name: Generate Apple-ready asset catalog from original artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .pots-build-venv
          .pots-build-venv/bin/pip install --quiet Pillow
          .pots-build-venv/bin/python POTSTracker/tools/prepare_assets.py

      - name: Generate native Xcode project
        working-directory: POTSTracker
        run: xcodegen generate --spec project.yml

      - name: Build for iOS Simulator, unsigned
        working-directory: POTSTracker
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project POTSTracker.xcodeproj \
            -scheme POTSTracker \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Build for physical iPhone, unsigned
        working-directory: POTSTracker
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project POTSTracker.xcodeproj \
            -scheme POTSTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Ensure AltStore-readable standard PNG icons
        shell: bash
        run: |
          set -euo pipefail
          .pots-build-venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          icon_path = Path("POTSTracker/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png")
          app_path = Path("POTSTracker/build-device/Build/Products/Release-iphoneos/POTSTracker.app")
          with Image.open(icon_path) as source:
              image = source.convert("RGB")
              assert image.size == (1024, 1024)
              for filename, size in [
                  ("AppIcon60x60@2x.png", (120, 120)),
                  ("AppIcon76x76@2x~ipad.png", (152, 152)),
              ]:
                  target = app_path / filename
                  image.resize(size, Image.Resampling.LANCZOS).save(target, "PNG")
                  with Image.open(target) as check:
                      check.load()
                      assert check.size == size
                  assert b"CgBI" not in target.read_bytes()[:40]
                  print("Standard PNG for AltStore preview:", target.name, size)
          PY

      - name: Verify installed app's version and increasing build number
        working-directory: POTSTracker
        shell: bash
        run: |
          set -euo pipefail
          INFO="build-device/Build/Products/Release-iphoneos/POTSTracker.app/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$INFO")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$INFO")"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$INFO")"
          echo "Installed app identity: $BUNDLE · v$VERSION (build $BUILD)"
          test "$VERSION" = "0.3.0"
          test "$BUILD" = "$GITHUB_RUN_NUMBER"
          test "$BUNDLE" = "com.valentinebsaa.potstracker"
          DISPLAY="$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$INFO")"
          test "$DISPLAY" = "POTS & Posies"
          test -s build-device/Build/Products/Release-iphoneos/POTSTracker.app/Assets.car
          FACE="$(/usr/libexec/PlistBuddy -c 'Print NSFaceIDUsageDescription' "$INFO")"
          CAMERA="$(/usr/libexec/PlistBuddy -c 'Print NSCameraUsageDescription' "$INFO")"
          ICON="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$INFO")"
          echo "$FACE" | grep -iq 'journal'
          echo "$CAMERA" | grep -iq 'camera'
          test "$ICON" = "AppIcon"
          if /usr/libexec/PlistBuddy -c 'Print NSHealthShareUsageDescription' "$INFO" >/dev/null 2>&1; then
            echo "::error::Unexpected removed HealthKit usage permission in app Info.plist."
            exit 1
          fi
          test ! -f POTSTracker.entitlements
          test -s build-device/Build/Products/Release-iphoneos/POTSTracker.app/AppIcon60x60@2x.png
          echo "Verified: Face ID and camera permissions, no HealthKit dependency, AppIcon fallback."
          test -f Sources/WelcomeAndPrivacyView.swift
          test -f Sources/PulseSignalAnalyzer.swift
          test -f Tests/PulseSignalAnalyzerTests.swift
          test -f Tests/TabNavigationRoutingTests.swift
          test -f Tests/PosiesFeatureUpgradeTests.swift
          test -f Sources/ExpandedTrackingView.swift
          test -f Sources/PosiesCalendarView.swift
          test -f Sources/PosiesReportsView.swift
          test -f Sources/PosiesDataTransfer.swift
          test -f Sources/PosiesDataManagementView.swift
          test -f Sources/PosiesRemindersView.swift
          test -f Sources/PosiesHomeCarousel.swift
          test -f Sources/PosiesCloudBackup.swift
          test -f Tests/PosiesHomeAndCloudBackupTests.swift
          test -f Tests/PosiesBackupAndTrackerPolishTests.swift
          test -f Tests/PosiesChoiceToggleTests.swift
          test -f Sources/PosiesPremiumModels.swift
          test -f Sources/PosiesMedicationCabinetView.swift
          test -f Sources/PosiesNotificationPresentation.swift
          test -f Tests/PosiesPremiumCareTests.swift
          test -f Tests/PosiesDailyCareTests.swift
          test -f Tests/PosiesMedicationCatalogTests.swift
          test -f Tests/PosiesMedicationCabinetPolishTests.swift
          grep -q '@FocusState private var focusedField' Sources/PosiesMedicationCabinetView.swift
          grep -q 'ToolbarItemGroup(placement: .keyboard)' Sources/PosiesMedicationCabinetView.swift
          grep -q 'scrollDismissesKeyboard(.interactively)' Sources/PosiesMedicationCabinetView.swift
          echo "Verified v0.3.0 medication editor keyboard dismissal controls"
          grep -q 'struct PosiesMedicationProfile' Sources/PosiesPremiumModels.swift
          grep -q 'PosiesMedicationMeasurements.validPair' Sources/PosiesPremiumModels.swift
          grep -q 'selectionMenu' Sources/PosiesMedicationCabinetView.swift
          echo "Verified v0.3.0 structured medication editor and regression sources"
          test -f Sources/PosiesMedicationCatalog.swift
          grep -q 'PosiesMedicationCatalogView' Sources/PosiesMedicationCabinetView.swift
          grep -q 'PosiesMedicationReferenceDetail' Sources/PosiesMedicationCabinetView.swift
          grep -q 'PosiesMedicationCatalog.find' Sources/PosiesMedicationCabinetView.swift
          echo "Verified v0.3.0 library and original cabinet coverage"
          test -f Sources/PosiesQuickPresets.swift
          grep -q 'PosiesQuickPresets.values' Sources/ExpandedTrackingView.swift
          grep -q 'lastEvent(for:' Sources/PosiesMedicationCabinetView.swift
          grep -q 'if onSave(profile)' Sources/PosiesMedicationCabinetView.swift
          echo "Verified v0.3.0 quick choices and medication save protections"
          grep -q 'PosiesNotificationDelegate' Sources/POTSTrackerApp.swift
          grep -q 'PosiesGentleGuidance' Sources/LogViews.swift
          grep -q 'PosiesMedicationLibrary' Sources/PosiesDataTransfer.swift
          grep -q 'posiesRevealReminderTypeV028' Sources/PosiesRemindersView.swift
          echo "Verified v0.3.0 guided vitals, medication cabinet, private notifications and backup compatibility"

          test -f Sources/PosiesChoiceBehavior.swift
          grep -q 'PosiesChoiceBehavior.toggleAmount' Sources/ExpandedTrackingView.swift
          grep -q 'PosiesChoiceBehavior.toggle' Sources/LogViews.swift
          grep -q 'rule.weekdays.removeAll' Sources/PosiesRemindersView.swift
          echo "Checked v0.2.8 tap-to-clear choices and backup usability polish"

          test -f Sources/PosiesBackupAccess.swift
          test -f Sources/PosiesTrackerHighlightsView.swift
          grep -q 'prepareManualBackup' Sources/PosiesDataManagementView.swift
          grep -q 'Never infer that a past dose was taken today' Sources/ExpandedTrackingView.swift
          echo "Verified: tap-responsive backup, optional premium trackers and backward-compatible extras tests"

          grep -q 'posiesAutomaticCloudConsentV025' Sources/PosiesDataManagementView.swift
          grep -q 'PosiesHomeCarousel' Sources/DashboardView.swift
          test ! -f POTSTracker.entitlements
          echo "Verified: carousel, opted-in iCloud runtime detection, Files fallback and retained AltStore signing"

          echo "Verified v0.3.0 trackers, calendar, reports, reminders, data transfer and regression source"

          grep -q 'TabNavigationRevisions' Sources/DashboardView.swift
          echo "Verified: tab-stack root routing regression test is present"
          ! grep -q "NSHealthShareUsageDescription" project.yml
          grep -q "posiesWelcomeAcknowledgedV021" Sources/POTSTrackerApp.swift
          echo "Verified: first-launch privacy acknowledgement and offline camera pulse analyzer"

      - name: Package unsigned IPA
        working-directory: POTSTracker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/Payload
          cp -R build-device/Build/Products/Release-iphoneos/POTSTracker.app dist/Payload/
          (cd dist && zip -qr POTS-and-Posies-v0.3.0-iOS16-unsigned.ipa Payload)
          unzip -l dist/POTS-and-Posies-v0.3.0-iOS16-unsigned.ipa | grep -q 'Payload/POTSTracker.app/Info.plist'

      - name: Upload unsigned IPA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: POTS-and-Posies-v0.3.0-iOS16-unsigned
          path: POTSTracker/dist/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Run Core Data and Home layout unit tests
        working-directory: POTSTracker
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for group in d.values() for x in group if x.get("isAvailable",True) and "iPhone" in x.get("name","")]; print(ids[0] if ids else "")')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::error::No available iPhone simulator to run the unit test suite."
            exit 1
          fi
          echo "Running iPhone simulator tests on $SIMULATOR_ID"
          xcodebuild \
            -project POTSTracker.xcodeproj \
            -scheme POTSTracker \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            test
