name: POTS Tracker | v0.1.1 Calm Home iOS 16

on:
  workflow_dispatch:
  push:
    paths:
      - "POTSTracker/**"
      - ".github/workflows/pots-build-1.yml"

concurrency:
  group: pots-tracker-ux-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Require all 13 approved custom icons
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f POTSTracker/Resources/Icons/00_App_Icon.png ]; then
            if [ -f POTSTracker/assets/approved-icon-pack.zip ]; then
              python3 POTSTracker/tools/import_icons.py POTSTracker/assets/approved-icon-pack.zip --repo-root . --replace
            else
              echo "::error::Missing approved POTS icon artwork. Upload approved-icon-pack.zip to POTSTracker/assets/ on GitHub, then rerun."
              exit 1
            fi
          fi
          python3 POTSTracker/tools/import_icons.py --help >/dev/null

      - name: Generate Apple-ready asset catalog from original artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .pots-build-venv
          .pots-build-venv/bin/pip install --quiet Pillow
          .pots-build-venv/bin/python POTSTracker/tools/prepare_assets.py

      - name: Generate native Xcode project
        working-directory: POTSTracker
        run: xcodegen generate --spec project.yml

      - name: Build for iOS Simulator, unsigned
        working-directory: POTSTracker
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project POTSTracker.xcodeproj \
            -scheme POTSTracker \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build for physical iPhone, unsigned
        working-directory: POTSTracker
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project POTSTracker.xcodeproj \
            -scheme POTSTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        working-directory: POTSTracker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/Payload
          cp -R build-device/Build/Products/Release-iphoneos/POTSTracker.app dist/Payload/
          (cd dist && zip -qr POTS-Tracker-v0.1.1-Calm-Home-iOS16-unsigned.ipa Payload)
          unzip -l dist/POTS-Tracker-v0.1.1-Calm-Home-iOS16-unsigned.ipa | grep -q 'Payload/POTSTracker.app/Info.plist'

      - name: Upload unsigned IPA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: POTS-Tracker-v0.1.1-Calm-Home-iOS16-unsigned
          path: POTSTracker/dist/*.ipa
          if-no-files-found: error
          retention-days: 30
