# Non-destructive import of one consolidated artwork ZIP, intact or in eight Release parts. This workflow does not merge into main or touch Assets.xcassets.
name: Berry Berry Blast | Import approved consolidated H1 artwork (55 originals)

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/berry-approved-h1-consolidated-import.yml'

permissions:
  contents: write

concurrency:
  group: berry-h1-approved-all-20261120
  cancel-in-progress: false

jobs:
  verified-artwork-staging:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.release.tag_name == 'berry-h1-approved-all-20261120' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated artwork branch
        uses: actions/checkout@v4
        with:
          ref: artwork/berry-seasonal-approved-h1-consolidated-20261120
          persist-credentials: true
          fetch-depth: 1

      - name: Download master ZIP or reconstruct from eight smaller Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='berry-h1-approved-all-20261120'
          NAME='Berry_Berry_Blast_ALL_Approved_Seasonal_Artwork_GitHub_2026-11-20.zip'
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$NAME" --dir "$RUNNER_TEMP" --clobber || true
          if [[ ! -f "$RUNNER_TEMP/$NAME" ]]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$NAME.part*" --dir "$RUNNER_TEMP" --clobber
            paths=()
            for index in 01 02 03 04 05 06 07 08; do
              part="$RUNNER_TEMP/$NAME.part$index"
              test -s "$part" || { echo "Missing or empty ZIP part $index" >&2; exit 1; }
              paths+=("$part")
            done
            cat "${paths[@]}" > "$RUNNER_TEMP/$NAME"
          fi
          echo 'Master artwork archive available; verifying pinned SHA-256 and all file contents.'

      - name: Validate every file and stage originals without overwriting changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/Berry_Berry_Blast_ALL_Approved_Seasonal_Artwork_GitHub_2026-11-20.zip" <<'PY'
          import hashlib, json, pathlib, stat, sys, zipfile
          zpath = pathlib.Path(sys.argv[1])
          expected_zip = '2e9e321a70aef320e849cd18d82533ae9e86fd6a23a36b02e584a55e25d4c210'
          def digest(data): return hashlib.sha256(data).hexdigest()
          if digest(zpath.read_bytes()) != expected_zip:
              raise SystemExit('Refusing ZIP: consolidated archive SHA mismatch')
          base = 'StrawberryShortcakeBlockBlast/ArtSource/'
          doc = base + '00_Consolidated_H1_2026-11-20/'
          with zipfile.ZipFile(zpath) as z:
              if z.testzip() is not None: raise SystemExit('Archive failed integrity test')
              names=z.namelist()
              if len(names)!=150 or len(set(names))!=150:
                  raise SystemExit('Unexpected ZIP entry count or duplicates')
              for info in z.infolist():
                  name=info.filename
                  p=pathlib.PurePosixPath(name)
                  mode=(info.external_attr>>16) & 0o170000
                  if (p.is_absolute() or '..' in p.parts or '\\' in name
                      or not name.startswith(base)
                      or not p.parts[2] in ('SeasonalGarden', 'ClockFrames', '00_Consolidated_H1_2026-11-20')
                      or info.is_dir() or mode not in (0, stat.S_IFREG)):
                      raise SystemExit('Unsafe or unexpected archive member: '+name)
              manifest=json.loads(z.read(doc+'CONSOLIDATED_ASSET_MANIFEST.json'))
              approved=manifest['entries']
              if len(approved)!=55 or manifest['unique_visually_approved_originals']!=55:
                  raise SystemExit('Expected 55 exact approved original artworks')
              expected_families={'Berry Home Classic':8, 'Digital Clock Frames':10,
                                 'Berry Story':8, 'Daily Harvest':8, 'More Adventures':8,
                                 'My Strawberry Cottage Decorations':8, 'Berry Collection':5}
              if manifest['families'] != expected_families:
                  raise SystemExit('Wrong artwork family counts')
              for item in approved:
                  name=item['original_path']
                  if not name.endswith('_Original.png') or not name.startswith(base):
                      raise SystemExit('Invalid original source path '+name)
                  raw=z.read(name)
                  if digest(raw)!=item['original_sha256']:
                      raise SystemExit('Original PNG checksum mismatch '+name)
                  if raw[:8] != bytes.fromhex('89504e470d0a1a0a'):
                      raise SystemExit('Non-PNG original '+name)
              checksum_lines=z.read(doc+'SHA256SUMS.txt').decode().splitlines()
              expected={}
              for line in checksum_lines:
                  value,name=line.split('  ',1)
                  if name in expected:raise SystemExit('Duplicate checksum entry '+name)
                  expected[name]=value
              if len(expected)!=149 or set(expected)!=set(names)-{doc+'SHA256SUMS.txt'}:
                  raise SystemExit('SHA256SUMS inventory mismatch')
              for name,sha in expected.items():
                  if digest(z.read(name))!=sha:
                      raise SystemExit('SHA-256 mismatch: '+name)
              # The first seasonal Batch 01 artwork is already in this branch.
              # Its eight original PNG blobs are byte-identical to the archive.
              # Two historical prose/manifest revisions differ; do not overwrite
              # either one. Preserve the archive's alternate exact bytes in the
              # consolidation audit folder. Any OTHER difference still fails.
              historical = {
                  base+'SeasonalGarden/00_Specs_And_Ledgers/H1_Batch01_Manifest.json',
                  base+'SeasonalGarden/00_Specs_And_Ledgers/H1_Batch01_README.md',
              }
              relocated={}
              for name in names:
                  target=pathlib.Path(name)
                  raw=z.read(name)
                  if target.is_symlink(): raise SystemExit('Refusing symlink target '+name)
                  if target.exists() and digest(target.read_bytes())!=digest(raw):
                      if name not in historical:
                          raise SystemExit('Existing artwork differs; refusing replacement: '+name)
                      alternate=pathlib.Path(doc+'Preserved_H1_Batch01_Archive_Metadata/'+target.name)
                      if alternate.exists() and digest(alternate.read_bytes())!=digest(raw):
                          raise SystemExit('Archived metadata conflict: '+str(alternate))
                      relocated[name]=alternate
              # Freeze a machine-readable redirect ledger, including both hashes.
              audit={
                  'status': 'Two historical Batch 01 metadata files preserved without overwriting',
                  'mapping': [
                      {'archive_path':n,
                       'staged_path':str(v),
                       'zip_sha256':digest(z.read(n)),
                       'existing_sha256':digest(pathlib.Path(n).read_bytes())}
                      for n,v in sorted(relocated.items())
                  ],
              }
              if len(relocated)!=2: raise SystemExit('Expected exactly two archived metadata differences')
              audit_path=pathlib.Path(doc+'IMPORT_PRESERVED_METADATA_MAPPING.json')
              audit_bytes=(json.dumps(audit,indent=2,sort_keys=True)+chr(10)).encode()
              if audit_path.exists() and audit_path.read_bytes()!=audit_bytes:
                  raise SystemExit('Import metadata mapping changed unexpectedly')
              for name in names:
                  target=relocated.get(name,pathlib.Path(name))
                  raw=z.read(name)
                  if target.is_symlink(): raise SystemExit('Refusing symlink target '+str(target))
                  if target.exists() and digest(target.read_bytes())!=digest(raw):
                      raise SystemExit('Refusing to replace alternate metadata '+str(target))
                  target.parent.mkdir(parents=True,exist_ok=True)
                  if not target.exists(): target.write_bytes(raw)
              audit_path.parent.mkdir(parents=True,exist_ok=True)
              if not audit_path.exists():audit_path.write_bytes(audit_bytes)
              print('Verified all 150 source archive entries and 55 approved unique originals.')
              print('Existing 8 Home Classic PNGs preserved unchanged; two historical metadata variants archived separately.')
          PY

      - name: Commit to isolated artwork staging branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'artwork/berry-seasonal-approved-h1-consolidated-20261120'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- StrawberryShortcakeBlockBlast/ArtSource
          if git diff --cached --quiet; then
            echo 'All exact artwork bytes already present. No changes.'
          else
            git commit -m 'art(seasonal): consolidate 55 approved original sources plus separate RGBA QA candidates'
            git push origin HEAD:artwork/berry-seasonal-approved-h1-consolidated-20261120
          fi
