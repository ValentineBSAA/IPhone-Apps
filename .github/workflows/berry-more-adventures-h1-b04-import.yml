# Import only the exact owner-approved H1-B04 More Adventures original and RGBA archive.
# This workflow executes on main but checks out and updates the ISOLATED H1-B04 artwork branch.
name: Berry Berry Blast | Verify More Adventures H1-B04 artwork import

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: berry-more-adventures-h1-b04-archive-import
  cancel-in-progress: false

jobs:
  check-and-import:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'berry-more-adventures-h1-b04' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated More Adventures art branch
        uses: actions/checkout@v4
        with:
          ref: artwork/berry-seasonal-more-adventures-h1-b04
          persist-credentials: true

      - name: Download exact uploaded Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download berry-more-adventures-h1-b04 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Berry_Berry_Blast_More_Adventures_H1_B04_8_Originals_RGBA_QA.zip' \
            --dir "$RUNNER_TEMP" --clobber

      - name: Validate archive contents, 8 originals and 8 RGBA files
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/Berry_Berry_Blast_More_Adventures_H1_B04_8_Originals_RGBA_QA.zip" <<'PY'
          import hashlib
          import json
          import pathlib
          import struct
          import sys
          import zipfile

          package = pathlib.Path(sys.argv[1])
          pinned = "a505666b3e0afc60f9af9f4a8d2539af2de8d26da7c08ef0d7d284ef0ab4562d"
          if hashlib.sha256(package.read_bytes()).hexdigest() != pinned:
              raise SystemExit("Wrong More Adventures ZIP SHA-256: import refused")
          prefix = "StrawberryShortcakeBlockBlast/ArtSource/SeasonalGarden/"
          manifest = prefix + "00_Specs_And_Ledgers/H1_B04_MoreAdventures_Manifest.json"
          with zipfile.ZipFile(package) as z:
              if z.testzip() is not None:
                  raise SystemExit("ZIP integrity check failed")
              m = json.loads(z.read(manifest).decode("utf-8"))
              entries = m["entries"]
              if len(entries) != 8:
                  raise SystemExit("Expected exactly eight individual icons")
              pairs = set()
              written = []
              for e in entries:
                  pair = (e["holiday"], e["appearance"])
                  if pair not in {(event, time) for event in ("Halloween","Christmas","Thanksgiving","Birthday") for time in ("Day","Night")} or pair in pairs:
                      raise SystemExit("Incorrect or duplicated holiday pair")
                  pairs.add(pair)
                  for key, digest_key in (("original_path","source_sha256"), ("rgba_candidate_path","candidate_sha256")):
                      name = e[key]
                      if not name.startswith(prefix) or not name.endswith(".png") or ".." in pathlib.PurePosixPath(name).parts:
                          raise SystemExit("Unsafe input image path: " + name)
                      raw = z.read(name)
                      if hashlib.sha256(raw).hexdigest() != e[digest_key]:
                          raise SystemExit("PNG content checksum mismatch: " + name)
                      if raw[:8] != bytes.fromhex("89504e470d0a1a0a") or raw[12:16] != b"IHDR":
                          raise SystemExit("Expected PNG file: " + name)
                      if struct.unpack(">II", raw[16:24]) != (1254,1254):
                          raise SystemExit("Wrong PNG dimensions: " + name)
                      if key == "rgba_candidate_path" and raw[25] != 6:
                          raise SystemExit("RGBA candidate is not true RGBA: " + name)
                      dest = pathlib.Path(name)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      if dest.exists() and dest.read_bytes() != raw:
                          raise SystemExit("Refusing to replace an existing different image: " + name)
                      dest.write_bytes(raw)
                      written.append(name)
              if len(pairs) != 8 or len(written) != 16:
                  raise SystemExit("Missing expected More Adventures images")
              metadata_paths = [
                  manifest,
                  prefix + "00_Specs_And_Ledgers/H1_B04_MoreAdventures_Manifest.csv",
                  prefix + "00_Specs_And_Ledgers/H1_B04_MoreAdventures_README.md"
              ]
              preview_paths = [n for n in z.namelist()
                               if n.startswith(prefix + "_Previews/") and n.endswith(".png")]
              if len(preview_paths) != 4:
                  raise SystemExit("Expected four QA preview PNGs")
              for name in metadata_paths + preview_paths:
                  raw = z.read(name)
                  dest = pathlib.Path(name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  if dest.exists() and dest.read_bytes() != raw:
                      raise SystemExit("Refusing to overwrite existing metadata/preview: " + name)
                  dest.write_bytes(raw)
              print("Verified and staged exactly 8 source PNGs, 8 RGBA candidates, 4 previews and metadata")
          PY

      - name: Commit verified bytes only on art staging branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'artwork/berry-seasonal-more-adventures-h1-b04'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- StrawberryShortcakeBlockBlast/ArtSource/SeasonalGarden
          if git diff --cached --quiet; then
            echo 'Already imported exact checked archive. No change.'
          else
            git commit -m 'art(seasonal): stage verified H1-B04 More Adventures originals and RGBA candidates'
            git push origin HEAD:artwork/berry-seasonal-more-adventures-h1-b04
          fi
