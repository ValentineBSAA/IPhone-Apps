# Verified one-time importer for the eight accepted seasonal Home/Classic artworks.
# This workflow runs from main, but writes ONLY to the isolated seasonal art branch.
name: Berry Berry Blast | Verify and stage Seasonal H1 Batch 01

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: berry-seasonal-h1-batch01-verified-import
  cancel-in-progress: false

jobs:
  verify-and-stage:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'seasonal-h1-batch01' }}
    name: Validate eight approved original PNGs and stage on separate branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated seasonal artwork branch
        uses: actions/checkout@v4
        with:
          ref: artwork/berry-seasonal-h1-batch01-staging
          persist-credentials: true

      - name: Download owner-uploaded Release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download seasonal-h1-batch01 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Berry_Berry_Blast_Seasonal_H1_Batch01_8_Approved_Sources.zip' \
            --dir "$RUNNER_TEMP" \
            --clobber

      - name: Validate exact archive and eight separate original PNGs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/Berry_Berry_Blast_Seasonal_H1_Batch01_8_Approved_Sources.zip" <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import struct
          import sys
          import zipfile

          archive_path = Path(sys.argv[1])
          manifest_path = Path("StrawberryShortcakeBlockBlast/ArtSource/SeasonalGarden/00_Specs_And_Ledgers/H1_Batch01_Manifest.json")
          m = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected_zip = "67bea35a6b8d6195d00a0aba2e3fdd7cecbcc473093d3cabeb74f39862bfc2c3"
          assert archive_path.is_file(), "Release ZIP not found."
          assert hashlib.sha256(archive_path.read_bytes()).hexdigest() == expected_zip, "Unexpected ZIP checksum."
          assert m["staging_release_zip_sha256"] == expected_zip
          assert len(m["entries"]) == 8 and m["expected_originals"] == 8

          found_pairs = set()
          with zipfile.ZipFile(archive_path) as archive:
              assert archive.testzip() is None, "ZIP integrity failure"
              for e in m["entries"]:
                  path = e["source_path"]
                  assert path.startswith("StrawberryShortcakeBlockBlast/ArtSource/SeasonalGarden/")
                  assert ".." not in Path(path).parts and "/Originals/" in path
                  assert path.endswith("_HomeClassic_Original.png")
                  pair = (e["holiday"], e["appearance"])
                  assert pair not in found_pairs, "Duplicate holiday Day/Night pair"
                  found_pairs.add(pair)

                  content = archive.read(path)
                  assert len(content) == e["bytes"], "Wrong source PNG size: " + path
                  assert hashlib.sha256(content).hexdigest() == e["sha256"], "Wrong source PNG SHA: " + path
                  assert content.startswith(bytes.fromhex("89504e470d0a1a0a"))
                  assert content[12:16] == b"IHDR"
                  assert struct.unpack(">II", content[16:24]) == (1254, 1254)
                  assert content[25] == 2, "Expected original RGB PNG"
                  dest = Path(path)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  if dest.exists():
                      assert dest.read_bytes() == content, "Existing original has been changed: " + path
                  else:
                      dest.write_bytes(content)
                  print("Verified:", path)

          assert found_pairs == {
              (holiday, daynight)
              for holiday in ("Halloween", "Christmas", "Thanksgiving", "Birthday")
              for daynight in ("Day", "Night")
          }
          proof_path = "StrawberryShortcakeBlockBlast/ArtSource/SeasonalGarden/_Previews/H1_Batch01_Review.jpg"
          with zipfile.ZipFile(archive_path) as archive:
              proof = archive.read(proof_path)
          assert hashlib.sha256(proof).hexdigest() == "8539a3ce4d5e43309ba6c0eee7be9fc160063a62e54c44f7da98e7c9881b3404"
          assert proof.startswith(bytes.fromhex("ffd8ff"))
          proof_target = Path(proof_path)
          proof_target.parent.mkdir(parents=True, exist_ok=True)
          if proof_target.exists():
              assert proof_target.read_bytes() == proof
          else:
              proof_target.write_bytes(proof)
          for e in m["entries"]:
              e["github_png_staged"] = True
          m["status"] = "Verified 8/8 source originals in isolated GitHub branch; RGBA/production routing/iPhone QA pending."
          m["verified_archive_sha256"] = expected_zip
          manifest_path.write_text(json.dumps(m, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit eight verified originals only to isolated artwork branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'artwork/berry-seasonal-h1-batch01-staging'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- StrawberryShortcakeBlockBlast/ArtSource/SeasonalGarden
          if git diff --cached --quiet; then
            echo 'All eight source images already present with exact SHA.'
          else
            git commit -m 'art(seasonal): import exact eight H1 holiday original images'
            git push origin HEAD:artwork/berry-seasonal-h1-batch01-staging
          fi
