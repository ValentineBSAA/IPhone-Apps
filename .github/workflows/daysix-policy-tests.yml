name: DaySix - Signing Policy Tests

on:
  push:
    branches:
      - main
      - feature/daysix-ios-signing-dashboard
    paths:
      - "DaySix/App/RenewalPolicy.swift"
      - "DaySix/App/SelfProvisioning.swift"
      - "DaySix/Tests/**"
      - ".github/workflows/daysix-policy-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "DaySix/App/RenewalPolicy.swift"
      - "DaySix/App/SelfProvisioning.swift"
      - "DaySix/Tests/**"
      - ".github/workflows/daysix-policy-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provisioning-and-renewal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout DaySix sources
        uses: actions/checkout@v4

      - name: Swift toolchain version
        run: swift --version

      - name: Compile policy and signature parsing tests
        run: |
          swiftc DaySix/App/RenewalPolicy.swift \
            DaySix/App/SelfProvisioning.swift \
            DaySix/Tests/main.swift \
            -o /tmp/daysix-policy-tests

      - name: Run expiry, retry, and policy tests
        run: /tmp/daysix-policy-tests
