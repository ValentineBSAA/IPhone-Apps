name: Berry Berry Blast | D0d real checkout, isolated persistence and ledger regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/berry-d0d-real-checkout-isolation-iphone16e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d0d-real-checkout-isolation:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: StrawberryShortcakeBlockBlast
    steps:
      - name: Checkout isolated D0d branch
        uses: actions/checkout@v4
        with:
          ref: feature/berry-advanced-dev-d0d-injected-checkout-ledger
          persist-credentials: false

      - name: Verify source inputs and actual production call sites
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/check_ios16_compat.py
          python3 Tools/verify_artwork.py
          python3 Tools/verify_audio_build2.py
          grep -q 'enum BerryStandardToolTransaction' BerryBlockBlast/BerryStandardToolTransaction.swift
          grep -q 'BerryStandardToolTransaction.purchase' BerryBlockBlast/BerryStandardToolCheckout.swift
          grep -q 'BerryStandardToolTransaction.consumeCharge' BerryBlockBlast/BerryGameSession.swift
          grep -q 'BerryStandardToolCheckout.purchase' BerryBlockBlast/BerryGameSession.swift
          grep -q 'BerryStandardToolCheckout.purchase' BerryBlockBlast/BerryDeveloperStateLab.swift
          grep -q 'init(defaults: UserDefaults = .standard)' BerryBlockBlast/BerryEconomyLedger.swift
          grep -q 'init(checkoutDefaults: UserDefaults = .standard' BerryBlockBlast/BerryGameSession.swift
          grep -q '#if BERRY_INTERNAL_QA' BerryBlockBlast/BerryDeveloperScenarioSandbox.swift
          grep -q '#if BERRY_INTERNAL_QA' BerryBlockBlast/BerryDeveloperStateLab.swift
          grep -q '#if BERRY_INTERNAL_QA' BerryBlockBlast/BerryDeveloperStateLabPanel.swift

      - name: Generate native iOS project
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Compile production Release without QA-only panels
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-d0d-release \
            CODE_SIGNING_ALLOWED=NO build
          APP='build-d0d-release/Build/Products/Release-iphonesimulator/BerryBlockBlast.app'
          test -d "$APP"
          if grep -qraE 'BerryDeveloperSandboxPanel|BerryDeveloperStateLabPanel|BerryQAIsolatedWallet' "$APP"; then
            echo 'QA-only sandbox symbol leaked into Release bundle' >&2
            exit 1
          fi
          echo 'Release app compiled. Internal QA panels and fake wallets absent.'

      - name: Discover the named iPhone 16e simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/berry-d0d-sims.json"
          python3 - "$RUNNER_TEMP/berry-d0d-sims.json" "$RUNNER_TEMP/berry-d0d-id" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          ids=[device['udid'] for devices in j['devices'].values()
               for device in devices if device.get('isAvailable') and device.get('name')=='iPhone 16e']
          if not ids: raise SystemExit('Required named iPhone 16e unavailable; no replacement device allowed')
          with open(sys.argv[2],'w') as out: out.write(ids[0])
          print('iPhone 16e:',ids[0])
          PY

      - name: Run real GameSession checkout, isolated ledger/save and D0-D0d regression on iPhone 16e
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          SIM="$(cat "$RUNNER_TEMP/berry-d0d-id")"
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath build-d0d-tests -parallel-testing-enabled NO \
            -only-testing:BerryBlockBlastTests/BerryDeveloperSandboxTests \
            -only-testing:BerryBlockBlastTests/BerryDeveloperStateLabTests \
            -only-testing:BerryBlockBlastTests/BerryStandardToolTransactionTests \
            -only-testing:BerryBlockBlastTests/BerryEconomyTests \
            -only-testing:BerryBlockBlastTests/BerryStandardToolCheckoutIsolationTests \
            CODE_SIGNING_ALLOWED=NO test

      - name: Ensure this run did not create an IPA
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name '*.ipa' -print -quit | grep -q .; then
            echo 'Unexpected IPA artifact created' >&2
            exit 1
          fi
          echo 'Tests only. No release, IPA or player-data export.'
