name: Last Seen - ElevenLabs read-only authentication check
on:
  push:
    branches: [feature/last-seen-build27-noras-world]
    paths: ['.github/last-seen-voice-auth-check.py']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check API authentication without generating speech
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 .github/last-seen-voice-auth-check.py
