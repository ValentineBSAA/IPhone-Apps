name: LAST SEEN - source and artwork preflight (no IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/last-seen-build27-noras-world
    paths:
      - '.github/workflows/last-seen-source-preflight.yml'

permissions:
  contents: read

jobs:
  source:
    name: Static source checks only
    runs-on: macos-15
    timeout-minutes: 12
    defaults:
      run:
        working-directory: LastSeen
    steps:
      - uses: actions/checkout@v4
      - name: Verify source metadata and offline fixture tests
        run: python3 Tools/verify_release_contract.py
      - name: Parse Swift files without compilation or linking
        run: |
          set -euo pipefail
          swift --version
          find LastSeenApp Tests UITests -name '*.swift' -print0 | xargs -0 swiftc -frontend -parse
          echo "Swift source parse completed; no native typecheck or build performed." >> "$GITHUB_STEP_SUMMARY"

  artwork:
    name: Retrieve exact artwork originals for private review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve both existing pinned release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lastseen-packs"
          gh release download L1 --repo "$GITHUB_REPOSITORY" --pattern 'Last-Seen-Build27-Recovered-Images.zip' --dir "$RUNNER_TEMP/lastseen-packs"
          gh release download L1 --repo "$GITHUB_REPOSITORY" --pattern 'Last-Seen-World-Photos-Expansion-01.zip' --dir "$RUNNER_TEMP/lastseen-packs"
      - name: Verify original bytes and prepare review sheets
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/lastseen-review-venv"
          "$RUNNER_TEMP/lastseen-review-venv/bin/python" -m pip install --disable-pip-version-check Pillow
          "$RUNNER_TEMP/lastseen-review-venv/bin/python" LastSeen/Tools/prepare_artwork_review.py --packs "$RUNNER_TEMP/lastseen-packs" --output "$RUNNER_TEMP/lastseen-review"
          echo "Outstanding originals verified for review; no narrative assignment or runtime import." >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise approved expansion importer in isolated scratch directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lastseen-import-test/LastSeenApp"
          cp "$RUNNER_TEMP/lastseen-packs/Last-Seen-World-Photos-Expansion-01.zip" "$RUNNER_TEMP/lastseen-import-test/"
          cp LastSeen/Tools/verify_world_photo_intake.py "$RUNNER_TEMP/lastseen-import-test/"
          cd "$RUNNER_TEMP/lastseen-import-test"
          python3 verify_world_photo_intake.py
          python3 - <<'PY'
          from pathlib import Path
          from verify_world_photo_intake import APPROVED, verified_originals, reject_held
          root=Path("LastSeenApp")
          originals=verified_originals("Last-Seen-World-Photos-Expansion-01.zip")
          assert {p.name for p in root.iterdir()} == APPROVED
          assert all((root/name).read_bytes()==data for name,data in originals.items())
          try:
              reject_held([root/"WorldPhoto_E01_11.png"])
          except AssertionError:
              pass
          else:
              raise AssertionError("Held original was not rejected")
          print("Approved expansion importer and rejection of held image verified.")
          PY
      - name: Exercise recovered importer and final disposition in scratch directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lastseen-recovered-test/LastSeenApp"
          cp "$RUNNER_TEMP/lastseen-packs/Last-Seen-Build27-Recovered-Images.zip" "$RUNNER_TEMP/lastseen-recovered-test/"
          cp LastSeen/Tools/import_recovered_art.py "$RUNNER_TEMP/lastseen-recovered-test/"
          cd "$RUNNER_TEMP/lastseen-recovered-test"
          python3 import_recovered_art.py
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          root=Path("LastSeenApp")
          approved={f"Recovered_B27_{i:02}.png" for i in range(1,30) if i!=6}
          assert {p.name for p in root.iterdir()}==approved
          with ZipFile("Last-Seen-Build27-Recovered-Images.zip") as z:
              assert all((root/name).read_bytes()==z.read(name) for name in approved)
          import os
          ledger=json.loads((Path(os.environ["RUNNER_TEMP"])/"lastseen-review/review-ledger.json").read_text())
          assert ledger["review_complete"] and not ledger["assets"] and len(ledger["assigned"])==38 and len(ledger["held"])==9
          print("Final disposition: 38 assigned, 9 held, exact originals verified.")
          PY
      - name: Preserve exact recovered artwork archive
        uses: actions/upload-artifact@v4
        with:
          name: LastSeen-B32-Recovered-Originals
          path: ${{ runner.temp }}/lastseen-packs/Last-Seen-Build27-Recovered-Images.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve exact expansion artwork archive
        uses: actions/upload-artifact@v4
        with:
          name: LastSeen-B32-Expansion-Originals
          path: ${{ runner.temp }}/lastseen-packs/Last-Seen-World-Photos-Expansion-01.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve visual review sheets and blank ledger
        uses: actions/upload-artifact@v4
        with:
          name: LastSeen-B32-Artwork-Review-Sheets
          path: |
            ${{ runner.temp }}/lastseen-review/review-ledger.json
          if-no-files-found: error
          retention-days: 14
