# Verified importer: 2 approved regular Day/Night live digital clock FRAME PNGs.
# Trigger by release tag berry-base-clocks-b01; modify ONLY isolated artwork branch.
name: Berry Berry Blast | Verify Base Digital Clock Frames C-B01
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: berry-base-clock-c-b01-import
  cancel-in-progress: false

jobs:
  import-clock-pair:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'berry-base-clocks-b01' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated artwork branch
        uses: actions/checkout@v4
        with:
          ref: artwork/berry-clock-frames-c-b01-staging
          persist-credentials: true

      - name: Download approved release archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download berry-base-clocks-b01 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Berry_Berry_Blast_Base_Clock_Frames_B01_Day_Night_RGBA.zip' \
            --dir "$RUNNER_TEMP" --clobber

      - name: Verify archive, exact original bytes and real-alpha PNG formats
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/Berry_Berry_Blast_Base_Clock_Frames_B01_Day_Night_RGBA.zip" <<'PY'
          from pathlib import Path
          import hashlib, json, struct, sys, zipfile
          zip_path = Path(sys.argv[1])
          target = Path('StrawberryShortcakeBlockBlast/ArtSource/ClockFrames/Base')
          assert zip_path.is_file(), 'Clock ZIP missing from GitHub Release'
          expected = 'ef36481929c5db6074d0bda3298614439e298dc4a4ae7f74d5f8e747aa5cd83a'
          assert hashlib.sha256(zip_path.read_bytes()).hexdigest() == expected, 'ZIP SHA mismatch'
          verify = {
             'Day': ('d6b023f8b698f57016a39e8cf63d3954369b176504843aea1dca10cec6fa0d09', 2013557),
             'Night': ('eaeebd1fdb168ed26d62f40d2b90cb9849f001dc831a5004ff96428e528d544b', 2214635)
          }
          with zipfile.ZipFile(zip_path) as archive:
            assert archive.testzip() is None
            manifest = json.loads(archive.read(str(target/'00_Manifest/C_B01_Manifest.json')))
            assert manifest['entry_count'] == 2
            for appearance, (sha,size) in verify.items():
              entry = next(e for e in manifest['entries'] if e['appearance'] == appearance)
              for field in ('source_path','rgba_path'):
                path = Path(entry[field])
                assert str(path).startswith(str(target)+'/')
                assert '..' not in path.parts
                data = archive.read(str(path))
                assert len(data) == size
                assert hashlib.sha256(data).hexdigest() == sha
                assert data[:8] == bytes.fromhex('89504e470d0a1a0a')
                assert data[12:16] == b'IHDR'
                assert struct.unpack('>II',data[16:24]) == (1774,887)
                assert data[24] == 8 and data[25] == 6, 'Expected 8-bit RGBA PNG'
                path.parent.mkdir(parents=True,exist_ok=True)
                if path.exists():
                  assert path.read_bytes() == data,'Existing original differs; refusing overwrite'
                else:
                  path.write_bytes(data)
            for sub in ('00_Manifest/C_B01_Manifest.json','00_Manifest/C_B01_Manifest.csv','00_Manifest/C_B01_README.md','_Previews/Berry_Berry_Blast_Base_Clock_Frames_B01_Review.png'):
              path = target/sub
              data = archive.read(str(path))
              path.parent.mkdir(parents=True,exist_ok=True)
              if path.exists():
                assert path.read_bytes() == data,'Preexisting different proof/manifest; refusing overwrite'
              else:
                path.write_bytes(data)
          tracker = Path('StrawberryShortcakeBlockBlast/CLOCK_FRAME_MASTER_CHECKLIST.md')
          text = tracker.read_text(encoding='utf-8')
          text = text.replace('⏳ package prepared; release import pending','✅ source staged, SHA verified')
          text = text.replace('- [ ] Owner uploads clock ZIP in a release','- [x] Owner uploads clock ZIP in a release')
          text = text.replace('- [ ] Release-triggered GitHub import succeeds','- [x] Release-triggered GitHub import succeeds')
          tracker.write_text(text,encoding='utf-8')
          print('Verified two Day/Night source originals plus two byte-identical RGBA candidates; no Xcode/game changes.')
          PY

      - name: Commit validated art to clock-only branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = artwork/berry-clock-frames-c-b01-staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- StrawberryShortcakeBlockBlast/ArtSource/ClockFrames/Base StrawberryShortcakeBlockBlast/CLOCK_FRAME_MASTER_CHECKLIST.md
          if git diff --cached --quiet; then
            echo 'Clock source originals already staged with exact checksums.'
          else
            git commit -m 'art(berry): import approved regular Day and Night digital clock frames'
            git push origin HEAD:artwork/berry-clock-frames-c-b01-staging
          fi
