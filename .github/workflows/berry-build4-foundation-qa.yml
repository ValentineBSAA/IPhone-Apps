name: Berry Berry Blast 0.5.14 Build 4.4 Boutique + Tools QA
on:
  push:
    branches: [feature/berry-build4-r5-boutique-tools-qa]
  workflow_dispatch:
permissions:
  contents: read
# Only superseded builds on this branch are canceled. Other branches are independent.
concurrency:
  group: berry-build4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StrawberryShortcakeBlockBlast
    steps:
      - uses: actions/checkout@v4
      - name: Source, iOS 16, 48 approved artworks and 67 original audio files
        run: |
          set -euo pipefail
          python3 Tools/verify_ios16_source.py
          python3 Tools/check_ios16_compat.py
          python3 Tools/verify_swiftui_test_imports.py
          python3 Tools/verify_build44_boutique_tools.py
          python3 Tools/verify_audio_build2.py
          python3 Tools/verify_0512_art_in_repo.py
          test -f BerryBlockBlast/BerryBoardVisual.swift
          test -f BerryBlockBlast/BerryBoardPersonality.swift
          test -f BerryBlockBlast/BerryPieceCatalog.swift
          test -f BerryBlockBlast/BerryDifficultyPolicy.swift
          test -f BerryBlockBlast/BerryResultText.swift
          test -f BerryBlockBlast/BerryGardenBorder.swift
          test -f BerryBlockBlast/BerryBuildIdentity.swift
          test -f BerryBlockBlast/BerryDeveloperGardenView.swift
          test -f BerryBlockBlast/BerrySpecialToolsSheet.swift
          test -f BerryBlockBlast/BerryComboMilestoneBanner.swift
          test -f BerryBlockBlast/BerryPolishPressStyle.swift
          test -f BerryBlockBlast/BerryBlossomEdgeFrame.swift
          test -f Tests/BerryResponsiveGameplayLayoutTests.swift
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          names=['Dev_Build_Information_Berry_Blueprint','Dev_Combo_Preview_Fireworks',
            'Dev_Diagnostics_Strawberry_Pulse','Dev_Economy_Inspector_Two_Currencies',
            'Dev_Experimental_Features_Moon_Potion','Dev_Notification_Test_Berry_Bell',
            'Dev_Save_Inspector_Berry_Drive','Dev_Timers_Moon_Clock',
            'Garden_Helpers_Watering_Can']
          root=Path('BerryBlockBlast/Assets.xcassets')
          for name in names:
              folder=root/(name+'.imageset')
              meta=json.loads((folder/'Contents.json').read_text())
              image=folder/(name+'.png')
              png=image.read_bytes()
              assert meta['images'][0]['filename']==name+'.png', name
              assert png[:8]==bytes.fromhex('89504e470d0a1a0a'), name
              w,h=struct.unpack('>II',png[16:24])
              assert (w,h)==(192,192), (name,w,h)
          print('PASS: 9 independently named approved iPhone-sized icons.')
          PY
          python3 - <<'PY'
          from pathlib import Path
          game=Path('BerryBlockBlast/BerryGameView.swift').read_text()
          frame=Path('BerryBlockBlast/BerryBlossomEdgeFrame.swift').read_text()
          layout=Path('BerryBlockBlast/BerryGameplayLayout.swift').read_text()
          assert 'Image("Blossom_Glass_Frame_Transparent_Center")' not in game
          assert 'BerryBlossomEdgeFrame()' in game
          assert 'touchDiagnostics: touchDiagnostics' in game
          assert 'lineWidth: 7' in frame
          assert 'comfortableWidth = width * 0.87' in layout
          print('PASS: frame never overlays gameplay; responsive screen budget active.')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          image=Path('BerryBlockBlast/Assets.xcassets/Tile_Pink.imageset/Tile_Pink.png')
          data=image.read_bytes()
          assert data[:8]==bytes.fromhex('89504e470d0a1a0a'), 'Pink tile is not a PNG'
          assert struct.unpack('>II',data[16:24])==(160,160), 'Pink tile dimensions changed'
          assert hashlib.sha256(data).hexdigest()=='5cf64371058073cf2924b0bcf0ff864e50cc61ef0a5b80e015952ee9f4ba9775', 'Unapproved pink tile content'
          source=Path('BerryBlockBlast/BerryStyle.swift').read_text()
          assert 'Image("Tile_Pink")' in source, 'Pink image not displayed by gameplay'
          assert 'BerryPinkTilePolicy.shouldUseApprovedTile' in source, 'Default pink tint policy not wired'
          assert source.count('Image("Tile_Pink")')==1, 'Duplicate pink renderer branch'
          game=Path('BerryBlockBlast/BerryGameView.swift').read_text()
          score=Path('BerryBlockBlast/BerryScoreSpotlight.swift').read_text()
          assert 'BERRY CLASSIC SCORE' not in score
          assert '🍓 BERRY CLASSIC •' not in game
          assert 'YOUR FOREVER STRAWBERRY GARDEN' in game
          assert 'Three pieces • Chase your best!' in game
          print('PASS: approved dark pink PNG routed to classic/endless.')
          PY
          test -f Tests/BerryBoardFrameContainmentTests.swift
          test -f Tests/BerryResultTextReliabilityTests.swift
          test -f Tests/BerryDifficultyPolicyTests.swift
          test -f Tests/BerryBoardPersonalityTests.swift
          python3 - <<'PY'
          from pathlib import Path
          names=['BerryFullTrayRegressionTests.swift','BerryTrayVisibilityTests.swift',
                 'BerryBoardTouchMappingTests.swift','BerryFullScreenGameplayTests.swift',
                 'BerryPhysicalScreenGeometryTests.swift','BerryLiveCountdownTests.swift',
                 'BerryTimedLifecycleTests.swift','BerryDailyHarvestAlmanacTests.swift',
                 'BerryTrophyGardenTests.swift']
          for name in names: assert (Path('Tests')/name).is_file(),name
          print('QA source suite present. Dynamic tests run on real simulators below.')
          PY
  engine-regression:
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: StrawberryShortcakeBlockBlast
    steps:
      - uses: actions/checkout@v4
      - name: Type-check production engine and run deterministic regression
        run: |
          set -euo pipefail
          command -v swiftc
          swiftc -swift-version 5 \
            BerryBlockBlast/BlockEngine.swift \
            BerryBlockBlast/BerryPieceCatalog.swift \
            BerryBlockBlast/BerryDifficultyPolicy.swift \
            Tools/verify_0513_engine_regression.swift \
            -o /tmp/berry-0513-engine-regression
          /tmp/berry-0513-engine-regression
      - name: Catch macOS runner configuration regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('../.github/workflows/berry-build4-foundation-qa.yml').read_text()
          assert 'runs-on: macos-15-intel' in workflow, 'Runner fallback accidentally removed'
          assert 'max-parallel: 1' in workflow, 'Simulators may compete for scarce runners'
          assert 'cancel-in-progress: true' in workflow and 'github.ref' in workflow, 'Old global workflow queue regression'
          assert 'needs: [integrity, engine-regression]' in workflow
          assert 'needs: [integrity, engine-regression, simulators]' in workflow
          print('PASS: regression gate is independent of macOS runner availability')
          PY
  simulators:
    needs: [integrity, engine-regression]
    # Intel is a supported runner; the previous ARM macos-15 jobs
    # were both cancelled before any step (runner allocation failure).
    runs-on: macos-15-intel
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slug: iphone14pro
            model: iPhone 14 Pro
          - slug: iphone16e
            model: iPhone 16e
    defaults:
      run:
        working-directory: StrawberryShortcakeBlockBlast
    env:
      DEVICE_NAME: ${{ matrix.model }}
      DEVICE_SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project and validate syntax
        run: |
          set -euo pipefail
          brew install xcodegen
          python3 Tools/install_art510.py
          xcodegen generate --spec project.yml
          find BerryBlockBlast Tests -name '*.swift' -type f -print0 |
            xargs -0 xcrun swiftc -frontend -parse -swift-version 5
      - name: Require named iPhone model, never silently substitute
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          def listed(*parts):
              return json.loads(subprocess.check_output(
                 ['xcrun','simctl','list',*parts,'-j'],text=True))
          name=os.environ['DEVICE_NAME']
          available=[d for group in listed('devices','available')['devices'].values()
                     for d in group if d.get('isAvailable') and d.get('name')==name]
          if available:
              udid=available[0]['udid']
          else:
              types=[d for d in listed('devicetypes')['devicetypes'] if d['name']==name]
              runtimes=[r for r in listed('runtimes')['runtimes']
                        if r.get('isAvailable') and r['identifier'].split('.')[-1].startswith('iOS-')]
              if not types: raise SystemExit('BLOCKED: missing exact device type '+name)
              if not runtimes: raise SystemExit('BLOCKED: missing iOS simulator runtime')
              runtime=sorted(runtimes,key=lambda r:tuple(int(n) for n in r['version'].split('.')))[-1]
              udid=subprocess.check_output([
                  'xcrun','simctl','create','Berry QA '+name,
                  types[0]['identifier'],runtime['identifier']],text=True).strip()
          print('Actual simulator selected:',name,udid)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIM_UDID='+udid+'\n')
          PY
      - name: Run entire XCTest suite on actual simulator screen
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIM_UDID" -b
          mkdir -p .build/QA
          xcodebuild -project BerryBlockBlast.xcodeproj -scheme BerryBlockBlast \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath ".build/QA/$DEVICE_SLUG-derived" \
            -resultBundlePath ".build/QA/$DEVICE_SLUG.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Export screenshots of full iPhone screen and require evidence
        run: |
          set -euo pipefail
          mkdir -p ".build/QA/$DEVICE_SLUG-captures"
          xcrun xcresulttool export attachments \
            --path ".build/QA/$DEVICE_SLUG.xcresult" \
            --output-path ".build/QA/$DEVICE_SLUG-captures"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path('.build/QA')/(os.environ['DEVICE_SLUG']+'-captures')
          images=[p for p in root.rglob('*') if p.suffix.lower() in ('.png','.jpg','.jpeg')]
          print('Simulator screenshot attachments:',[p.name for p in images])
          if len(images)<2: raise SystemExit('BLOCKED: not enough visual evidence')
          PY
      - name: Save actual geometry and screenshots, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Berry-${{ matrix.slug }}-real-window-regression
          path: |
            StrawberryShortcakeBlockBlast/.build/QA/${{ matrix.slug }}.xcresult
            StrawberryShortcakeBlockBlast/.build/QA/${{ matrix.slug }}-captures/
          retention-days: 30
  candidate:
    needs: [integrity, engine-regression, simulators]
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: StrawberryShortcakeBlockBlast
    steps:
      - uses: actions/checkout@v4
      - name: Native iOS 16 device compilation and unsigned IPA inspection
        run: |
          set -euo pipefail
          brew install xcodegen
          python3 Tools/install_art510.py
          xcodegen generate --spec project.yml
          xcodebuild -project BerryBlockBlast.xcodeproj -scheme BerryBlockBlast \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath .build/Candidate CODE_SIGNING_ALLOWED=NO build
          mkdir -p dist/Payload
          cp -R .build/Candidate/Build/Products/Release-iphoneos/BerryBlockBlast.app dist/Payload/
          (cd dist && zip -qr Berry-Berry-Blast-v0.5.14-build4.4-BOUTIQUE-TOOLS-QA-unsigned.ipa Payload)
          python3 Tools/verify_audio_build2.py \
            --ipa dist/Berry-Berry-Blast-v0.5.14-build4.4-BOUTIQUE-TOOLS-QA-unsigned.ipa
          unzip -t dist/Berry-Berry-Blast-v0.5.14-build4.4-BOUTIQUE-TOOLS-QA-unsigned.ipa | tail -2
          python3 - <<'PY'
          import zipfile,plistlib
          filename='dist/Berry-Berry-Blast-v0.5.14-build4.4-BOUTIQUE-TOOLS-QA-unsigned.ipa'
          with zipfile.ZipFile(filename) as z:
              assert 'Payload/BerryBlockBlast.app/Assets.car' in z.namelist()
              info=plistlib.loads(z.read('Payload/BerryBlockBlast.app/Info.plist'))
              assert info['CFBundleShortVersionString']=='0.5.14'
              assert info['CFBundleVersion']=='44'
              assert info.get('MinimumOSVersion','16.0')=='16.0'
          print('Simulator QA passed. Still requires physical-device signoff.')
          PY
          echo '0.5.14 Build 4.4 BOUTIQUE + TOOLS QA. Board Studio and Special Tools need physical iPhone signoff. NOT a public release.' \
            > dist/HARDWARE-SIGNOFF-REQUIRED.txt
      - name: Upload candidate only, never auto-publish release
        uses: actions/upload-artifact@v4
        with:
          name: Berry-0514-Build4.4-BOUTIQUE-TOOLS-QA-UNSIGNED-IPA
          path: |
            StrawberryShortcakeBlockBlast/dist/Berry-Berry-Blast-v0.5.14-build4.4-BOUTIQUE-TOOLS-QA-unsigned.ipa
            StrawberryShortcakeBlockBlast/dist/HARDWARE-SIGNOFF-REQUIRED.txt
          retention-days: 14
