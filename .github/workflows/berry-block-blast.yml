name: Berry Block Blast iPhone IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'StrawberryShortcakeBlockBlast/**'
      - '.github/workflows/berry-block-blast.yml'

permissions:
  contents: read

jobs:
  unsigned-iphone-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: StrawberryShortcakeBlockBlast
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install original icon renderer
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip Pillow
      - name: Generate Strawberry Sweet app icon
        run: .venv/bin/python Tools/generate_icon.py
      - name: Generate native Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build for physical iPhones (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package clearly versioned IPA
        run: |
          set -eu
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/BerryBlockBlast.app dist/Payload/
          cd dist
          zip -qr Berry-Block-Blast-v0.1.0-unsigned.ipa Payload
          test -s Berry-Block-Blast-v0.1.0-unsigned.ipa
          unzip -l Berry-Block-Blast-v0.1.0-unsigned.ipa | grep -q 'Payload/BerryBlockBlast.app/Info.plist'
      - name: Upload iPhone IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Berry-Block-Blast-v0.1.0-iPhone-unsigned
          path: StrawberryShortcakeBlockBlast/dist/Berry-Block-Blast-v0.1.0-unsigned.ipa
          if-no-files-found: error
