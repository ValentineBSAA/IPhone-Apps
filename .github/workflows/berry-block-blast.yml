# Optional manual GitHub Actions smoke build. Codemagic is the PRIMARY iPhone IPA builder.
# Branch-only push trigger is temporary for 0.5.5 validation; remove before merge.
name: Berry Block Blast 0.5.5 build 1 manual QA

on:
  workflow_dispatch:
  # Temporary branch-only CI trigger while validating 0.5.5 build 1.
  push:
    branches:
      - fix/berry-055-native-touch
    paths:
      - 'StrawberryShortcakeBlockBlast/**'
      - '.github/workflows/berry-block-blast.yml'

concurrency:
  group: berry-block-blast-test-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unsigned-iphone-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: StrawberryShortcakeBlockBlast
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Confirm both approved assets before compiling
        run: python3 Tools/verify_artwork.py

      - name: Generate the native Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned physical iPhone application
        run: |
          set -euo pipefail
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run engine and drag geometry tests on iPhone Simulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((v["udid"] for ds in d["devices"].values() for v in ds if v.get("isAvailable") and v.get("name","").startswith("iPhone")), ""))')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::error::No available iPhone simulator. Tests may not be skipped."
            exit 1
          fi
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build-simulator \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Package versioned unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/BerryBlockBlast.app dist/Payload/
          cd dist
          zip -qr Berry-Block-Blast-v0.5.5-build1-unsigned.ipa Payload
          test -s Berry-Block-Blast-v0.5.5-build1-unsigned.ipa
          unzip -l Berry-Block-Blast-v0.5.5-build1-unsigned.ipa | grep -q 'Payload/BerryBlockBlast.app/Info.plist'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Berry-Block-Blast-v0.5.5-build1-iPhone-unsigned
          path: StrawberryShortcakeBlockBlast/dist/Berry-Block-Blast-v0.5.5-build1-unsigned.ipa
          if-no-files-found: error
