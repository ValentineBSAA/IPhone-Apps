# Optional manual GitHub Actions smoke build. Codemagic is the PRIMARY iPhone IPA builder.
# Feature-branch validation; the unsigned IPA is a test artifact until device QA.
name: Berry Block Blast 0.5.6 build 2 manual QA

on:
  workflow_dispatch:
  # Temporary branch-only CI trigger while validating 0.5.6 build 2.
  push:
    branches:
      - feature/berry-056-build2-ultimate
    paths:
      - 'StrawberryShortcakeBlockBlast/**'
      - '.github/workflows/berry-block-blast.yml'

concurrency:
  group: berry-block-blast-build2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unsigned-iphone-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: StrawberryShortcakeBlockBlast
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Confirm both approved assets before compiling
        run: python3 Tools/verify_artwork.py

      - name: Verify original 51 M4A songs plus 16 WAV sound effects
        run: python3 Tools/verify_audio_build2.py

      - name: Generate the native Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned physical iPhone application
        run: |
          set -euo pipefail
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify all 67 audio files in compiled iPhone app
        run: python3 Tools/verify_audio_build2.py --app build/Build/Products/Release-iphoneos/BerryBlockBlast.app

      - name: Package versioned unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/BerryBlockBlast.app dist/Payload/
          cd dist
          zip -qr Berry-Block-Blast-v0.5.6-build2-unsigned.ipa Payload
          test -s Berry-Block-Blast-v0.5.6-build2-unsigned.ipa
          unzip -l Berry-Block-Blast-v0.5.6-build2-unsigned.ipa | grep -q 'Payload/BerryBlockBlast.app/Info.plist'
          cd ..
          python3 Tools/verify_audio_build2.py --ipa dist/Berry-Block-Blast-v0.5.6-build2-unsigned.ipa

      # The source, compiled .app and IPA must be byte-verified before
      # any artifact is created. Device/simulator QA still runs afterward.
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Berry-Block-Blast-v0.5.6-build2-iPhone-unsigned
          path: StrawberryShortcakeBlockBlast/dist/Berry-Block-Blast-v0.5.6-build2-unsigned.ipa
          if-no-files-found: error

      - name: Run puzzle engine, Blitz, 24x24 and 51-track playlist tests on iPhone Simulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((v["udid"] for ds in d["devices"].values() for v in ds if v.get("isAvailable") and v.get("name","").startswith("iPhone")), ""))')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::error::No available iPhone simulator. Tests may not be skipped."
            exit 1
          fi
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build-simulator \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test
