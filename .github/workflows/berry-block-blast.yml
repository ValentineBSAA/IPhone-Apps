name: Berry Block Blast iPhone IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'StrawberryShortcakeBlockBlast/**'
      - '.github/workflows/berry-block-blast.yml'

permissions:
  contents: read

jobs:
  unsigned-iphone-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: StrawberryShortcakeBlockBlast
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install original icon renderer
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip Pillow
      - name: Generate Strawberry Sweet app icon
        run: .venv/bin/python Tools/generate_icon.py
      - name: Generate native Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build for physical iPhones (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Compile iOS simulator unit tests
        run: |
          set -o pipefail
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
      - name: Run Berry engine tests on an available iPhone simulator
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d.get("isAvailable") and "iPhone" in d.get("name","")]; print(devices[0]["udid"] if devices else "")')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::error::No available iPhone simulator found on the macOS runner"
            exit 1
          fi
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building
      - name: Package clearly versioned IPA
        run: |
          set -eu
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/BerryBlockBlast.app dist/Payload/
          cd dist
          zip -qr Berry-Block-Blast-v0.5.3-unsigned.ipa Payload
          test -s Berry-Block-Blast-v0.5.3-unsigned.ipa
          unzip -l Berry-Block-Blast-v0.5.3-unsigned.ipa | grep -q 'Payload/BerryBlockBlast.app/Info.plist'
      - name: Upload iPhone IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Berry-Block-Blast-v0.5.3-iPhone-unsigned
          path: StrawberryShortcakeBlockBlast/dist/Berry-Block-Blast-v0.5.3-unsigned.ipa
          if-no-files-found: error
