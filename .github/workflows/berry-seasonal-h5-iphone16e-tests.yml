name: Berry Berry Blast | H5 seasonal iPhone 16e tests (no release)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/berry-seasonal-h5-iphone16e-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h5-iphone16e-regression:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: StrawberryShortcakeBlockBlast
    steps:
      - name: Checkout dormant H5 branch
        uses: actions/checkout@v4
        with:
          ref: feature/berry-seasonal-h5-asset-fallback-lab
          persist-credentials: false

      - name: Verify Xcode and iOS 16 build inputs
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 Tools/check_ios16_compat.py
          python3 Tools/verify_artwork.py
          python3 Tools/verify_audio_build2.py

      - name: Install XcodeGen and generate the native iPhone project
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Resolve named iPhone 16e simulator (no substitute model)
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/h5-simulators.json"
          python3 - "$RUNNER_TEMP/h5-simulators.json" "$RUNNER_TEMP/h5-iphone16e-id" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          matches=[d['udid'] for devices in data['devices'].values()
                   for d in devices if d.get('isAvailable') and d.get('name')=='iPhone 16e']
          if not matches:
              raise SystemExit('Named iPhone 16e simulator unavailable. H5 QA must not silently switch devices.')
          open(sys.argv[2],'w').write(matches[0])
          print('Selected named iPhone 16e simulator:',matches[0])
          PY

      - name: Run new seasonal calendar and asset-fallback XCTest methods on iPhone 16e
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(cat "$RUNNER_TEMP/h5-iphone16e-id")"
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build-h5-simulator \
            -parallel-testing-enabled NO \
            -only-testing:BerryBlockBlastTests/BerrySeasonalCalendarTests \
            -only-testing:BerryBlockBlastTests/BerrySeasonalAssetResolverTests \
            CODE_SIGNING_ALLOWED=NO \
            test
