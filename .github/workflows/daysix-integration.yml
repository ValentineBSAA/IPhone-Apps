name: DaySix integration tests

on:
  push:
    paths:
      - "DaySixIntegration/**"
      - ".github/workflows/daysix-integration.yml"
  pull_request:
    paths:
      - "DaySixIntegration/**"
      - ".github/workflows/daysix-integration.yml"
  workflow_dispatch:

jobs:
  swift-tests:
    name: Validate IPA import and renewal logic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2.1"
      - name: Run DaySix core tests
        run: swift test --package-path DaySixIntegration
