name: Berry Berry Blast | I2 combined Quest Story, approved art and safe Birthday gift

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/berry-i2-quest-art-birthday-iphone16e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i2-quest-art-birthday:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: StrawberryShortcakeBlockBlast
    steps:
      - name: Checkout I2 combined Quest Story, approved art and Birthday source branch
        uses: actions/checkout@v4
        with:
          ref: feature/berry-integration-i2-quest-art-birthday
          persist-credentials: false

      - name: Verify source inputs and actual production call sites
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/check_ios16_compat.py
          python3 Tools/verify_artwork.py
          python3 Tools/verify_audio_build2.py
          grep -q 'enum BerryStandardToolTransaction' BerryBlockBlast/BerryStandardToolTransaction.swift
          grep -q 'BerryStandardToolTransaction.purchase' BerryBlockBlast/BerryStandardToolCheckout.swift
          grep -q 'BerryStandardToolTransaction.consumeCharge' BerryBlockBlast/BerryGameSession.swift
          grep -q 'BerryStandardToolCheckout.purchase' BerryBlockBlast/BerryGameSession.swift
          grep -q 'BerryStandardToolCheckout.purchase' BerryBlockBlast/BerryDeveloperStateLab.swift
          grep -q 'init(defaults: UserDefaults = .standard)' BerryBlockBlast/BerryEconomyLedger.swift
          grep -q 'init(checkoutDefaults: UserDefaults = .standard' BerryBlockBlast/BerryGameSession.swift
          grep -q 'enum BerryStandardPurchaseJournal' BerryBlockBlast/BerryStandardPurchaseJournal.swift
          grep -q 'BerryStandardPurchaseJournal.prepare' BerryBlockBlast/BerryGameSession.swift
          grep -q 'BerryStandardPurchaseJournal.recover' BerryBlockBlast/BerryGameSession.swift
          grep -q 'applyStandardToolSpendRecovery' BerryBlockBlast/BerryEconomyLedger.swift
          grep -q 'enum BerryBoutiquePurchasePolicy' BerryBlockBlast/BerryBoutiquePurchasePolicy.swift
          grep -q 'BerryBoutiquePurchasePolicy.canPurchase' BerryBlockBlast/BerryGameSession.swift
          grep -q 'saveInventoryOnly()' BerryBlockBlast/BerryGameSession.swift
          grep -q 'persistPremium(boardChanged: false)' BerryBlockBlast/BerryGameSession.swift
          grep -q 'checkoutDefaults.set(cottageDecorations' BerryBlockBlast/BerryGameSession.swift
          grep -q 'checkoutLedger.recordSpend(price, item: id)' BerryBlockBlast/BerryGameSession.swift
          test -f Tests/BerryCottagePremiumIsolationTests.swift
          test -f Tests/BerryDeveloperCommerceLabTests.swift
          grep -q '#if BERRY_INTERNAL_QA' BerryBlockBlast/BerryDeveloperCommerceLab.swift
          grep -q '#if BERRY_INTERNAL_QA' BerryBlockBlast/BerryDeveloperCommerceLabPanel.swift
          grep -q 'BerryDeveloperCommerceLabPanel()' BerryBlockBlast/BerryDeveloperGardenView.swift
          test -f Tests/BerryPremiumToolSaveRestoreTests.swift
          test -f Tests/BerryDeveloperToolActionLabTests.swift
          test -f Tests/BerryPremiumAdvancedRescueIsolationTests.swift
          test -f Tests/BerryDeveloperToolActionExpansionTests.swift
          test -f Tests/BerryDailyIsolatedCalendarTests.swift
          test -f Tests/BerryDailyRewardIsolationTests.swift
          test -f Tests/BerryQuestStoryProgressIsolationTests.swift
          test -f Tests/BerryDeveloperQuestStoryLabTests.swift
          test -f Tests/BerryApprovedArtFallbackTests.swift
          test -f Tests/BerryBirthdayPolicyIsolationTests.swift
          test -f BerryBlockBlast/BerryBirthdayPolicy.swift
          grep -q 'BerryBirthdayPolicy.isBirthday' BerryBlockBlast/BerryModes.swift
          grep -q 'BerryBirthdayPolicy.maximumDay' BerryBlockBlast/BerrySettingsHub.swift
          grep -q 'session.usesCheckoutDefaults(defaults)' BerryBlockBlast/BerryBirthdayPolicy.swift
          test -f BerryBlockBlast/BerryArtResolver.swift
          grep -q 'BerryArtResolver.displayName(for: "BerryVillageMap")' BerryBlockBlast/BerryModes.swift
          grep -q 'BerryArtResolver.displayName(for: "BerryQuestBoardArt")' BerryBlockBlast/BerryProgression.swift
          grep -q 'guard session.usesCheckoutDefaults(defaults)' BerryBlockBlast/BerryProgression.swift
          grep -q '#if BERRY_INTERNAL_QA' BerryBlockBlast/BerryDeveloperQuestStoryLab.swift
          grep -q '#if BERRY_INTERNAL_QA' BerryBlockBlast/BerryDeveloperQuestStoryLabPanel.swift
          grep -q 'BerryDeveloperQuestStoryLabPanel()' BerryBlockBlast/BerryDeveloperGardenView.swift
          grep -q 'guard session.usesCheckoutDefaults(defaults)' BerryBlockBlast/BerryProgression.swift
          grep -q 'func usesCheckoutDefaults(_ defaults:' BerryBlockBlast/BerryGameSession.swift
          grep -q 'static func completedDays(defaults:' BerryBlockBlast/BerryDailyHarvestView.swift
          grep -q 'checkoutDefaults.set(rewardsLog, forKey: "berryblockblast.rewards.v1")' BerryBlockBlast/BerryGameSession.swift
          grep -q 'now: @escaping () -> Date' BerryBlockBlast/BerryGameSession.swift
          grep -q 'guard current == .active' BerryBlockBlast/BerryDailyHarvestView.swift
          grep -q 'case goldenCheckout = "Buy & Rescue Garden"' BerryBlockBlast/BerryDeveloperToolActionLab.swift
          grep -q 'BerryDeveloperToolActionLabPanel()' BerryBlockBlast/BerryDeveloperGardenView.swift
          grep -q 'checkoutLedger.recordSpend(Self.goldenStrawberryCost' BerryBlockBlast/BerryGameSession.swift
          grep -q 'checkoutDefaults.set(rewardsLog, forKey: "berryblockblast.rewards.v1")' BerryBlockBlast/BerryGameSession.swift
          grep -q '#if BERRY_INTERNAL_QA' BerryBlockBlast/BerryDeveloperToolActionLab.swift
          grep -q '#if BERRY_INTERNAL_QA' BerryBlockBlast/BerryDeveloperToolActionLabPanel.swift
          grep -q 'BerryDeveloperToolActionLabPanel()' BerryBlockBlast/BerryDeveloperGardenView.swift
          grep -q 'savedEndlessEngine(side: size, defaults: checkoutDefaults)' BerryBlockBlast/BerryGameSession.swift
          grep -q 'checkoutLedger.recordSpend(cost, item: id)' BerryBlockBlast/BerryGameSession.swift
          grep -q '#if BERRY_INTERNAL_QA' BerryBlockBlast/BerryDeveloperScenarioSandbox.swift
          grep -q '#if BERRY_INTERNAL_QA' BerryBlockBlast/BerryDeveloperStateLab.swift
          grep -q '#if BERRY_INTERNAL_QA' BerryBlockBlast/BerryDeveloperStateLabPanel.swift

      - name: Generate native iOS project
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Compile production Release without QA-only panels
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-i2-release \
            CODE_SIGNING_ALLOWED=NO build
          APP='build-i2-release/Build/Products/Release-iphonesimulator/BerryBlockBlast.app'
          test -d "$APP"
          if grep -qraE 'BerryDeveloperSandboxPanel|BerryDeveloperStateLabPanel|BerryDeveloperCommerceLabPanel|BerryDeveloperCommerceLab|BerryDeveloperToolActionLabPanel|BerryDeveloperToolActionLab|BerryDeveloperQuestStoryLabPanel|BerryDeveloperQuestStoryLab|BerryQAIsolatedWallet' "$APP"; then
            echo 'QA-only sandbox symbol leaked into Release bundle' >&2
            exit 1
          fi
          echo 'Release app compiled. Internal QA panels and fake wallets absent.'

      - name: Discover the named iPhone 16e simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/berry-i2-sims.json"
          python3 - "$RUNNER_TEMP/berry-i2-sims.json" "$RUNNER_TEMP/berry-i2-id" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          ids=[device['udid'] for devices in j['devices'].values()
               for device in devices if device.get('isAvailable') and device.get('name')=='iPhone 16e']
          if not ids: raise SystemExit('Required named iPhone 16e unavailable; no replacement device allowed')
          with open(sys.argv[2],'w') as out: out.write(ids[0])
          print('iPhone 16e:',ids[0])
          PY

      - name: Run I2 Quest Story, artwork and Birthday regressions on iPhone 16e
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          SIM="$(cat "$RUNNER_TEMP/berry-i2-id")"
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath build-i2-tests -parallel-testing-enabled NO \
            -only-testing:BerryBlockBlastTests/BerryDeveloperSandboxTests \
            -only-testing:BerryBlockBlastTests/BerryDeveloperStateLabTests \
            -only-testing:BerryBlockBlastTests/BerryStandardToolTransactionTests \
            -only-testing:BerryBlockBlastTests/BerryEconomyTests \
            -only-testing:BerryBlockBlastTests/BerryStandardToolCheckoutIsolationTests \
            -only-testing:BerryBlockBlastTests/BerryStandardPurchaseRecoveryTests \
            -only-testing:BerryBlockBlastTests/BerryBoutiqueCheckoutIsolationTests \
            -only-testing:BerryBlockBlastTests/BerryCottagePremiumIsolationTests \
            -only-testing:BerryBlockBlastTests/BerryDeveloperCommerceLabTests \
            -only-testing:BerryBlockBlastTests/BerryPremiumToolSaveRestoreTests \
            -only-testing:BerryBlockBlastTests/BerryDeveloperToolActionLabTests \
            -only-testing:BerryBlockBlastTests/BerryPremiumAdvancedRescueIsolationTests \
            -only-testing:BerryBlockBlastTests/BerryDeveloperToolActionExpansionTests \
            -only-testing:BerryBlockBlastTests/BerryDailyIsolatedCalendarTests \
            -only-testing:BerryBlockBlastTests/BerryDailyRewardIsolationTests \
            -only-testing:BerryBlockBlastTests/BerryQuestStoryProgressIsolationTests \
            -only-testing:BerryBlockBlastTests/BerryDeveloperQuestStoryLabTests \
            -only-testing:BerryBlockBlastTests/BerryApprovedArtFallbackTests \
            -only-testing:BerryBlockBlastTests/BerryBirthdayPolicyIsolationTests \
            -only-testing:BerryBlockBlastTests/BerryBuild44BoutiqueToolsTests \
            CODE_SIGNING_ALLOWED=NO test

      - name: Ensure this run did not create an IPA
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name '*.ipa' -print -quit | grep -q .; then
            echo 'Unexpected IPA artifact created' >&2
            exit 1
          fi
          echo 'Tests only. No release, IPA or player-data export.'
