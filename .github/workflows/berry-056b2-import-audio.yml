name: Berry Blast 0.5.6 build 2 - Import original audio
on:
  push:
    branches: [feature/berry-056-build2-ultimate]
    paths: ['.github/workflows/berry-056b2-import-audio.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/berry-056-build2-ultimate
      - name: Download both new ZIPs from release audio-v1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/berry-audio"
          gh release download audio-v1.0 --repo "${{ github.repository }}" --pattern 'BerryBlastBlast-OST-v1.2-51Tracks-iOS.zip' --dir "$RUNNER_TEMP/berry-audio"
          gh release download audio-v1.0 --repo "${{ github.repository }}" --pattern 'BerryBlastBlast-SFX-v1.0-16Effects-iOS.zip' --dir "$RUNNER_TEMP/berry-audio"
      - name: Import recordings unchanged and inventory the original catalogues
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/berry-audio" <<'PY'
          from pathlib import Path
          import sys,zipfile,hashlib,json,re
          archive_dir=Path(sys.argv[1])
          base=Path("StrawberryShortcakeBlockBlast")
          specs=[
             ("BerryBlastBlast-OST-v1.2-51Tracks-iOS.zip",51,base/"Soundtrack","BerryTrack",{".m4a"}),
             ("BerryBlastBlast-SFX-v1.0-16Effects-iOS.zip",16,base/"SoundEffects","BerrySFX",{".m4a",".wav",".caf",".aif",".aiff",".mp3"})
          ]
          for zip_name,required,out,prefix,allowed in specs:
              archive=archive_dir/zip_name
              assert archive.is_file(),zip_name+" not found"
              with zipfile.ZipFile(archive) as z:
                  entries=[i for i in z.infolist() if not i.is_dir() and Path(i.filename).suffix.lower() in allowed and not i.filename.startswith("__MACOSX/") and "/._" not in i.filename]
                  print("SOURCE",zip_name,"entries",len(z.infolist()),"audio",len(entries))
                  for item in z.infolist():
                      if not item.is_dir():print("FILE",item.filename,item.file_size)
                  assert len(entries)==required,f"{zip_name} has {len(entries)} audio files, expected {required}"
                  def sortkey(i):
                      name=Path(i.filename).stem
                      match=re.match(r"^\s*(\d{1,2})[\s_.-]*",name)
                      return (int(match.group(1)) if match else 999,name.casefold(),i.filename.casefold())
                  entries.sort(key=sortkey)
                  out.mkdir(parents=True,exist_ok=True)
                  for old in out.glob(prefix+"*.*"):
                      if old.suffix.lower() in allowed:old.unlink()
                  catalog=[]
                  for idx,item in enumerate(entries,1):
                      raw=z.read(item)
                      suffix=Path(item.filename).suffix.lower()
                      if suffix==".m4a": assert raw[4:8]==b"ftyp",f"Invalid M4A {item.filename}"
                      name=f"{prefix}{idx:02d}{suffix}"
                      (out/name).write_bytes(raw)
                      title=Path(item.filename).stem
                      title=re.sub(r"^\s*\d{1,2}[\s_.-]+","",title).replace("_"," ").strip()
                      catalog.append(dict(id=idx,file=name,title=title,originalArchivePath=item.filename,sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw),mood="unclassified",role="unclassified"))
                  record={"version":2,"sourceRelease":"audio-v1.0","sourceArchive":zip_name,"sourceZIPSHA256":hashlib.sha256(archive.read_bytes()).hexdigest(),"tracks" if prefix=="BerryTrack" else "effects":catalog}
                  (out/"Catalog.json").write_text(json.dumps(record,indent=2,ensure_ascii=False)+"\n")
                  meta=out/"OriginalCatalog"
                  meta.mkdir(exist_ok=True)
                  for info in z.infolist():
                      if info.is_dir() or info in entries or info.file_size>1024*1024:continue
                      ext=Path(info.filename).suffix.lower()
                      if ext in {".json",".txt",".md",".csv"} and not info.filename.startswith("__MACOSX/"):
                          fname=Path(info.filename).name
                          if fname and fname!="Catalog.json":
                              dest=meta/fname
                              if dest.exists():dest=meta/(str(len(list(meta.iterdir())))+"-"+fname)
                              dest.write_bytes(z.read(info))
                  print("IMPORTED",len(catalog),prefix,"bytes",sum(x["bytes"] for x in catalog))
          PY
      - name: Commit 51 songs and 16 sound effects
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- StrawberryShortcakeBlockBlast/Soundtrack StrawberryShortcakeBlockBlast/SoundEffects
          if git diff --cached --quiet; then echo 'Already imported'; exit 0; fi
          git commit -m "Berry 0.5.6 build2: import 51 original songs and 16 sound effects"
          git push origin HEAD:feature/berry-056-build2-ultimate
