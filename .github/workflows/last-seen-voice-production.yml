name: Last Seen - one-take voice production
on:
  push:
    branches:
      - feature/last-seen-build27-noras-world
    paths:
      - '.github/last-seen-voice-request.json'
permissions:
  contents: write
concurrency:
  group: last-seen-voice-production
  cancel-in-progress: false
jobs:
  generate:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/last-seen-build27-noras-world
      - name: Validate single-run request
        run: python3 LastSeen/Tools/produce_voice_candidates.py --check
      - name: Install audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate one take per script
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 LastSeen/Tools/produce_voice_candidates.py
      - name: Preserve candidate files even if a later clip fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Last-Seen-Voice-Candidates
          path: LastSeen/VoiceAssets/VoiceCandidateWork/
          if-no-files-found: ignore
      - name: Commit completed audition archive only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LastSeen/VoiceAssets/LastSeen_B32_VoiceCandidates_v1.zip
          git commit -m "[skip ci] chore(last-seen): preserve ten voice audition candidates"
          git push origin HEAD:feature/last-seen-build27-noras-world
