name: Berry Berry Blast 0.5.12 Build 3 Full-Game Regression and Illustrated IPA
on:
  push:
    branches: [fix/berry-berry-blast-0512-build3-tray-layout-regression]
    paths:
      - 'StrawberryShortcakeBlockBlast/**'
      - '.github/workflows/berry-0512-build3-full-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: berry-0512-build3-regression
  cancel-in-progress: true
jobs:
  native-regression:
    name: Full Game + Calendar Simulator Tests & Native Build 3
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: StrawberryShortcakeBlockBlast
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift source, all 48 approved PNG assets and audio
        run: |
          set -euo pipefail
          python3 Tools/verify_ios16_source.py
          python3 Tools/check_ios16_compat.py
          python3 Tools/verify_audio_build2.py
          python3 Tools/verify_0512_art_in_repo.py
          find BerryBlockBlast Tests -type f -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse -swift-version 5
      - name: Prepare Xcode 16 project and inherited assets
        run: |
          set -euo pipefail
          brew install xcodegen
          python3 Tools/install_art510.py
          xcodegen generate --spec project.yml
      - name: Choose available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > .simdevices.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('.simdevices.json'))
          phones=[d for group in data['devices'].values() for d in group
                  if d.get('isAvailable') and 'iPhone' in d.get('name','')]
          if not phones: raise SystemExit('NO IPHONE SIMULATOR AVAILABLE')
          candidates=[d for d in phones if 'iPhone 16' in d['name'] or 'iPhone 14 Pro' in d['name']]
          picked=(candidates or phones)[0]
          print('iOS simulator:',picked['name'],picked['udid'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SIM_UDID='+picked['udid']+'\n')
          PY
      - name: Run entire regression test suite including full iPhone layout
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project BerryBlockBlast.xcodeproj -scheme BerryBlockBlast \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath .build/Simulator \
            -resultBundlePath .build/Build3Regression.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test
      - name: Compile native iOS 16 iPhone application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project BerryBlockBlast.xcodeproj -scheme BerryBlockBlast \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/Device CODE_SIGNING_ALLOWED=NO build
      - name: Package fully illustrated unsigned Build 3 IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/Payload
          cp -R .build/Device/Build/Products/Release-iphoneos/BerryBlockBlast.app dist/Payload/
          (cd dist && zip -qr Berry-Berry-Blast-v0.5.12-build3-ALL-48-ART-unsigned.ipa Payload)
          python3 Tools/verify_audio_build2.py --ipa dist/Berry-Berry-Blast-v0.5.12-build3-ALL-48-ART-unsigned.ipa
          unzip -t dist/Berry-Berry-Blast-v0.5.12-build3-ALL-48-ART-unsigned.ipa | tail -2
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('dist/Berry-Berry-Blast-v0.5.12-build3-ALL-48-ART-unsigned.ipa')
          with zipfile.ZipFile(p) as z:
              assert any(x.endswith('/Assets.car') for x in z.namelist()), 'missing compiled artwork'
              assert any(x.endswith('/BerryBlockBlast') for x in z.namelist()), 'missing native executable'
          print('VERIFIED:',p.name,format(p.stat().st_size/1024/1024,'.1f'),'MiB')
          PY
      - name: Upload full regression images and test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Berry-Berry-Blast-v0.5.12-Build3-Full-Regression-XCTest
          path: StrawberryShortcakeBlockBlast/.build/Build3Regression.xcresult
          retention-days: 14
      - name: Upload unsigned native iPhone Build 3 test IPA
        uses: actions/upload-artifact@v4
        with:
          name: Berry-Berry-Blast-v0.5.12-build3-ALL-48-ART-unsigned-IPA
          path: StrawberryShortcakeBlockBlast/dist/Berry-Berry-Blast-v0.5.12-build3-ALL-48-ART-unsigned.ipa
          retention-days: 14
