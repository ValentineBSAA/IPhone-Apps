name: Berry Berry Blast | D0 isolated Developer Garden sandbox QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/berry-d0-developer-sandbox-iphone16e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d0-disposable-fixtures:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: StrawberryShortcakeBlockBlast
    steps:
      - name: Checkout isolated D0 sandbox branch
        uses: actions/checkout@v4
        with:
          ref: feature/berry-advanced-dev-d0-isolated-sandbox
          persist-credentials: false

      - name: Check source and original app resources
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/check_ios16_compat.py
          python3 Tools/verify_artwork.py
          python3 Tools/verify_audio_build2.py
          grep -q '#if BERRY_INTERNAL_QA' BerryBlockBlast/BerryDeveloperScenarioSandbox.swift
          grep -q '#if BERRY_INTERNAL_QA' Tests/BerryDeveloperSandboxTests.swift

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Compile Release target with QA sandbox excluded
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-d0-release \
            CODE_SIGNING_ALLOWED=NO \
            build
          # Test harness should never be accessible in shipping compilation.
          if grep -qr 'BerryDeveloperSandboxPanel' build-d0-release/Build/Products/Release-iphonesimulator/BerryBlockBlast.app 2>/dev/null; then
            echo 'QA-only symbol leaked into release bundle' >&2
            exit 1
          fi

      - name: Resolve named iPhone 16e simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/berry-d0-sims.json"
          python3 - "$RUNNER_TEMP/berry-d0-sims.json" "$RUNNER_TEMP/berry-d0-id" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          matches=[d['udid'] for devices in data['devices'].values()
                   for d in devices if d.get('isAvailable') and d.get('name')=='iPhone 16e']
          if not matches:
              raise SystemExit('Required iPhone 16e simulator unavailable; no device substitution')
          open(sys.argv[2],'w').write(matches[0])
          print('Selected iPhone 16e:',matches[0])
          PY

      - name: Run all six D0 sandbox XCTest methods on iPhone 16e
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          SIM="$(cat "$RUNNER_TEMP/berry-d0-id")"
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath build-d0-test \
            -parallel-testing-enabled NO \
            -only-testing:BerryBlockBlastTests/BerryDeveloperSandboxTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Verify no build IPA or release artifacts were created
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name '*D0*.ipa' | grep -q .; then
            echo 'Unexpected IPA build from D0 source-only test workflow' >&2
            exit 1
          fi
          echo 'D0 tested as source and simulator-only. Nothing was released.'
