# Berry Block Blast: free personal Codemagic macOS M2 build.
# Run manually in Codemagic; no automatic build triggers.
workflows:
  berry-block-blast-unsigned:
    name: Berry Block Blast 0.5.5 build 1 unsigned iPhone IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: StrawberryShortcakeBlockBlast
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          set -e
          brew install xcodegen
      - name: Verify approved icon and mascot, generate Xcode project
        script: |
          set -e
          python3 Tools/verify_artwork.py
          xcodegen generate --spec project.yml
      - name: Run the iOS Simulator tests
        script: |
          set -e
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((x['udid'] for a in d['devices'].values() for x in a if x.get('isAvailable') and x.get('name','').startswith('iPhone')), ''))")
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator; tests must not be skipped."
            exit 1
          fi
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build-simulator \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Compile native iPhone app without signing
        script: |
          set -e
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA for signing on Windows
        script: |
          set -e
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/BerryBlockBlast.app dist/Payload/
          cd dist
          zip -qr Berry-Block-Blast-v0.5.5-build1-unsigned.ipa Payload
          test -s Berry-Block-Blast-v0.5.5-build1-unsigned.ipa
          unzip -l Berry-Block-Blast-v0.5.5-build1-unsigned.ipa | grep -q 'Payload/BerryBlockBlast.app/Info.plist'
    artifacts:
      - dist/*.ipa
      - build/Logs/Build/*.xcactivitylog
      - build-simulator/Logs/Test/*.xcresult
