# Berry Block Blast: free personal Codemagic macOS M2 build.
# Run manually in Codemagic; no automatic build triggers.
workflows:
  berry-block-blast-unsigned:
    name: Berry Block Blast 0.5.4 unsigned iPhone IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: StrawberryShortcakeBlockBlast
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen and icon generator dependencies
        script: |
          set -e
          brew install xcodegen
          python3 -m venv .venv
          .venv/bin/python -m pip install Pillow
      - name: Generate original app icon and Xcode project
        script: |
          set -e
          .venv/bin/python Tools/generate_icon.py
          xcodegen generate --spec project.yml
      - name: Compile native iPhone app without signing
        script: |
          set -e
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA for signing on Windows
        script: |
          set -e
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/BerryBlockBlast.app dist/Payload/
          cd dist
          zip -qr Berry-Block-Blast-v0.5.4-unsigned.ipa Payload
          test -s Berry-Block-Blast-v0.5.4-unsigned.ipa
          unzip -l Berry-Block-Blast-v0.5.4-unsigned.ipa | grep -q 'Payload/BerryBlockBlast.app/Info.plist'
    artifacts:
      - dist/*.ipa
      - build/Logs/Build/*.xcactivitylog
