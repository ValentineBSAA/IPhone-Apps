# Berry Block Blast 0.5.8 iOS16 native cloud build on Codemagic.
# Test branch only; no Windows PC, Apple signing credentials, or main branch changes.
workflows:
  berry-block-blast-unsigned:
    name: Berry Block Blast 0.5.8 build 1 unsigned iPhone IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: StrawberryShortcakeBlockBlast
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'feature/berry-058-polish'
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      xcode: 26.5
    scripts:
      - name: Install XcodeGen
        script: |
          set -e
          brew install xcodegen
      - name: Import mandatory 0.5.8 19-artwork catalogs + approved character portraits
        script: |
          set -e
          if [ -f ../BuildPayload/Berry_Block_Blast_0.5.8_19_ArtCatalogs_Including_New_Character.zip ]; then
            echo 'Installing 16 game-art catalogs + 3 user-supplied character portraits...'
            unzip -qo ../BuildPayload/Berry_Block_Blast_0.5.8_19_ArtCatalogs_Including_New_Character.zip -d ..
            test -s BerryBlockBlast/Assets.xcassets/StrawberryCandyBlock.imageset/StrawberryCandyBlock.png
            test -s BerryBlockBlast/Assets.xcassets/CottageGardenBackground.imageset/CottageGardenBackground.png
            test -s BerryBlockBlast/Assets.xcassets/BerryCharacterPortrait.imageset/BerryCharacterPortrait.jpg
            test -s BerryBlockBlast/Assets.xcassets/BerryCharacterStanding.imageset/BerryCharacterStanding.jpg
            test -s BerryBlockBlast/Assets.xcassets/BerryCharacterCelebrate.imageset/BerryCharacterCelebrate.jpg
          else
            echo 'ERROR: 0.5.8 artwork is missing. Upload Berry_Block_Blast_0.5.8_19_ArtCatalogs_Including_New_Character.zip to BuildPayload on this branch.'
            exit 1
          fi
      - name: Verify approved icon and mascot, generate Xcode project
        script: |
          set -e
          python3 Tools/verify_artwork.py
          python3 Tools/verify_audio_build2.py
          python3 Tools/verify_ios16_source.py
          python3 Tools/verify_build57.py
          xcodegen generate --spec project.yml
      - name: Compile native iPhone app without signing
        script: |
          set -e
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA for iPhone 14 Pro testing
        script: |
          set -e
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/BerryBlockBlast.app dist/Payload/
          python3 Tools/verify_audio_build2.py --app build/Build/Products/Release-iphoneos/BerryBlockBlast.app
          cd dist
          zip -qr Berry-Block-Blast-v0.5.8-build1-unsigned.ipa Payload
          test -s Berry-Block-Blast-v0.5.8-build1-unsigned.ipa
          unzip -l Berry-Block-Blast-v0.5.8-build1-unsigned.ipa | grep -q 'Payload/BerryBlockBlast.app/Info.plist'
          cd ..
          python3 Tools/verify_audio_build2.py --ipa dist/Berry-Block-Blast-v0.5.8-build1-unsigned.ipa
          echo '--- Verified IPA output ---'
          ls -lh dist/*.ipa
          shasum -a 256 dist/*.ipa
          echo "Clone directory: $CM_BUILD_DIR"
          echo "Artifact export directory: ${CM_EXPORT_DIR:-not-provided}"
          if [ -n "${CM_EXPORT_DIR:-}" ]; then
            mkdir -p "$CM_EXPORT_DIR"
            cp dist/*.ipa "$CM_EXPORT_DIR/"
            ls -lh "$CM_EXPORT_DIR/"*.ipa
          fi
      # A simulator failure must never block packaging a valid native IPA.
      # This separate compile gate catches Swift errors in the XCTest bundle.
      - name: Compile all XCTest sources without launching the simulator
        script: |
          set -euo pipefail
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO build-for-testing
      # Codemagic can hang before the XCTest runner connects, independent of
      # app correctness. This diagnostic uses the selected SDK's exact runtime.
      # Genuine test failures still fail CI; runner hangs are marked NOT VERIFIED.
      - name: Attempt XCTest on matching simulator with bounded timeout
        script: |
          set -euo pipefail
          python3 Tools/run_codemagic_simulator.py
    artifacts:
      # Artifact patterns resolve from the repository clone root.
      - $CM_BUILD_DIR/StrawberryShortcakeBlockBlast/dist/*.ipa
      - $CM_EXPORT_DIR/*.ipa
      - StrawberryShortcakeBlockBlast/dist/*.ipa
      - StrawberryShortcakeBlockBlast/dist/*.log
      - StrawberryShortcakeBlockBlast/dist/*.txt
      - StrawberryShortcakeBlockBlast/dist/*.xcresult
      - StrawberryShortcakeBlockBlast/build/Logs/Build/*.xcactivitylog
      - StrawberryShortcakeBlockBlast/build-simulator/Logs/Test/*.xcresult
