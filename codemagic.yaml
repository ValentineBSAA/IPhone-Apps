# Berry Berry Blast 0.5.10 Build 2 - original board visibility and compact iPhone layout.
# Test branch only; no Windows PC, Apple signing credentials, or main branch changes.
workflows:
  berry-berry-blast-0510-polish-unsigned:
    name: Berry Berry Blast 0.5.10 BUILD 2 - clear board, restore settings and HUD layout
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: StrawberryShortcakeBlockBlast
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'feature/berry-berry-blast-0510-layout-build2'
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      xcode: 26.5
    scripts:
      # This runs BEFORE image unpacking, Homebrew, and Xcode.
      # It catches stale build-number pins and broken validator syntax cheaply.
      - name: Fast preflight - versions, iOS16 APIs, Python syntax and existing assets
        script: |
          set -euo pipefail
          python3 -m compileall -q Tools
          python3 Tools/verify_ios16_source.py
          python3 Tools/check_ios16_compat.py
          python3 Tools/verify_artwork.py
          python3 Tools/verify_build57.py
          python3 Tools/verify_audio_build2.py
          python3 Tools/verify_polish_source.py
          # Syntax-only Swift check requires no XcodeGen project and catches
          # malformed Swift source BEFORE invoking expensive xcodebuild jobs.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files = sorted([str(p) for folder in ("BerryBlockBlast", "Tests")
                          for p in Path(folder).rglob("*.swift")])
          if not files:
              raise SystemExit("PREFLIGHT FAILED: no Swift source files found")
          subprocess.run(["xcrun", "swiftc", "-frontend", "-parse",
                          "-swift-version", "5", *files], check=True)
          print(f"PASS: Swift parser checked {len(files)} source and test files")
          PY
          echo "PREFLIGHT PASS: version, iOS16, Python syntax, Swift syntax, approved art, 51 M4A and 16 WAV"
      - name: Install XcodeGen
        script: |
          set -e
          brew install xcodegen
      - name: Install all 19 approved images and genuine strawberry-shaped fruit tile
        script: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zipfile
          root = Path.cwd().parent.resolve()
          payload = root / "BuildPayload" / "Berry_Block_Blast_0.5.8_19_ArtCatalogs_CloudReady.zip"
          if not payload.is_file():
              raise SystemExit("Missing full 19-image 0.5.8 asset pack")
          with zipfile.ZipFile(payload) as z:
              for entry in z.namelist():
                  target = (root / entry).resolve()
                  if not target.is_relative_to(root):
                      raise SystemExit("Unsafe path in art payload: " + entry)
              z.extractall(root)
          artroot = Path.cwd() / "BerryBlockBlast" / "Assets.xcassets"
          for name in ("BerryCharacterPortrait","BerryCharacterStanding","BerryCharacterCelebrate"):
              assert (artroot / (name + ".imageset") / (name + ".jpg")).is_file(), name
          encoded = root / "BuildPayload" / "BerryRealStrawberry.png.base64"
          raw = base64.b64decode("".join(encoded.read_text().splitlines()), validate=True)
          assert hashlib.sha256(raw).hexdigest() == "a27d31fa7e27b3ef8fe0938127d348304eeec61da3d5d04204371837e90ae1e1"
          directory = artroot / "BerryRealStrawberry.imageset"
          directory.mkdir(parents=True, exist_ok=True)
          (directory / "BerryRealStrawberry.png").write_bytes(raw)
          (directory / "Contents.json").write_text(json.dumps({
              "images":[{"filename":"BerryRealStrawberry.png","idiom":"universal"}],
              "info":{"author":"xcode","version":1}
          }))
          print("PASS: all 19 art catalogs and real 128px RGBA strawberry tile")
          PY
      - name: Verify 0.5.8 artwork, audio, iOS16 and source, then generate Xcode project
        script: |
          set -euo pipefail
          python3 Tools/verify_artwork.py
          python3 Tools/verify_audio_build2.py
          python3 Tools/verify_ios16_source.py
          python3 Tools/verify_build57.py
          python3 Tools/verify_build58.py
          xcodegen generate --spec project.yml
      - name: Install original Berry Berry Blast mascot, logo, Boutique and village artwork
        script: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          root = Path.cwd().parent.resolve()
          pack = root / "BuildPayload" / "Berry_Berry_Blast_0.5.9_Art_Integration_Cloud.zip"
          if not pack.is_file():
              raise SystemExit("Missing 0.5.9 rebrand asset pack from GitHub")
          digest = hashlib.sha256(pack.read_bytes()).hexdigest()
          expected = "0129663d88df5b2504449e156eaf7252e4536e9e2afa05b835fdb49062336760"
          if digest != expected:
              raise SystemExit("Berry Berry Blast art payload SHA-256 mismatch")
          with zipfile.ZipFile(pack) as z:
              catalogs = [n for n in z.namelist() if n.endswith(".imageset/Contents.json")]
              if len(catalogs) != 17:
                  raise SystemExit(f"Expected 17 image catalogs, found {len(catalogs)}")
              for filename in z.namelist():
                  resolved = (root / filename).resolve()
                  if not resolved.is_relative_to(root):
                      raise SystemExit("Refusing unsafe archive entry: " + filename)
              z.extractall(root)
          art = Path.cwd() / "BerryBlockBlast" / "Assets.xcassets"
          for name in ("BerryCharacterPortrait", "BerryCharacterStanding", "BerryCharacterCelebrate"):
              # New art is PNG; remove superseded JPG from the same imageset,
              # otherwise actool can warn about ambiguous unassigned files.
              (art / (name + ".imageset") / (name + ".jpg")).unlink(missing_ok=True)
          print("PASS: 17 new image catalogs, same save keys and approved mascot")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, shutil
          root = Path.cwd().parent.resolve()
          payload = root / "BuildPayload" / "BerryBerryBlast_0.5.9_PolishedPlayfield_CloudReady.zip"
          expected = "f0aedd94661c4b3d821c5d39d070b9d741846ad4f4e900c8cb370b97fa1fce77"
          if not payload.is_file():
              raise SystemExit("Missing verified board and mascot art payload")
          actual = hashlib.sha256(payload.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Playfield art payload SHA mismatch: {actual}")
          try:
              with zipfile.ZipFile(payload) as z:
                  damaged = z.testzip()
                  if damaged:
                      raise SystemExit("Corrupted board-art entry: " + damaged)
                  entries = z.namelist()
                  imagesets = [x for x in entries if x.endswith(".imageset/Contents.json")]
                  if len(imagesets) != 11:
                      raise SystemExit(f"Expected 11 new image catalogs, got {len(imagesets)}")
                  required = "StrawberryShortcakeBlockBlast/BerryBlockBlast/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
                  if required not in entries:
                      raise SystemExit("Missing newly approved mascot iPhone app icon")
                  appicon = z.read(required)
                  if appicon[:8] != bytes([137,80,78,71,13,10,26,10]):
                      raise SystemExit("App icon is not a PNG")
                  if (int.from_bytes(appicon[16:20], "big"),int.from_bytes(appicon[20:24], "big")) != (1024,1024):
                      raise SystemExit("App icon must be 1024x1024")
                  if appicon[25] != 2:
                      raise SystemExit("App icon must be opaque RGB, not transparent")
                  for name in entries:
                      if not (root / name).resolve().is_relative_to(root):
                          raise SystemExit("Refusing unsafe art path: " + name)
                  z.extractall(root)
          except zipfile.BadZipFile as exc:
              raise SystemExit("Verified playfield art ZIP is invalid: " + str(exc))
          assets = Path.cwd() / "BerryBlockBlast" / "Assets.xcassets"
          # Keep the old stable asset name used by every Story and home view.
          centered = assets / "BerryMascotCenteredCircle.imageset" / "BerryMascotCenteredCircle.png"
          portrait = assets / "BerryCharacterPortrait.imageset" / "BerryCharacterPortrait.png"
          if not centered.is_file():
              raise SystemExit("Missing centered transparent original mascot")
          shutil.copyfile(centered, portrait)
          print("PASS: 10 polished playfield images, centered mascot, and new opaque app icon")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          root = Path.cwd().parent.resolve()
          path = root / "BuildPayload" / "Berry_Berry_Blast_GoldenStrawberry_CloudPatch.zip"
          expected = "4f73d536af342d1640f3554bf83c479336c38a3a6910cf21c90db02fbdcd0da7"
          if not path.is_file():
              raise SystemExit("Missing Golden Strawberry original artwork")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if digest != expected:
              raise SystemExit("Golden Strawberry checksum mismatch: " + digest)
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad is not None:
                  raise SystemExit("Golden Strawberry ZIP CRC failed: " + bad)
              for name in z.namelist():
                  if not (root / name).resolve().is_relative_to(root):
                      raise SystemExit("Unsafe Golden Strawberry archive entry: " + name)
              z.extractall(root)
          print("PASS: Golden Strawberry original game icon installed")
          PY
          python3 Tools/verify_build510.py
      - name: Compile native iPhone app without signing
        script: |
          set -e
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package Berry Berry Blast 0.5.10 native unsigned IPA for iPhone 14 Pro
        script: |
          set -e
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/BerryBlockBlast.app dist/Payload/
          python3 Tools/verify_audio_build2.py --app build/Build/Products/Release-iphoneos/BerryBlockBlast.app
          cd dist
          zip -qr Berry-Berry-Blast-v0.5.10-build2-unsigned.ipa Payload
          test -s Berry-Berry-Blast-v0.5.10-build2-unsigned.ipa
          unzip -l Berry-Berry-Blast-v0.5.10-build2-unsigned.ipa | grep -q 'Payload/BerryBlockBlast.app/Info.plist'
          cd ..
          python3 Tools/verify_audio_build2.py --ipa dist/Berry-Berry-Blast-v0.5.10-build2-unsigned.ipa
          echo '--- Verified IPA output ---'
          ls -lh dist/*.ipa
          shasum -a 256 dist/*.ipa
          echo "Clone directory: $CM_BUILD_DIR"
          echo "Artifact export directory: ${CM_EXPORT_DIR:-not-provided}"
          if [ -n "${CM_EXPORT_DIR:-}" ]; then
            mkdir -p "$CM_EXPORT_DIR"
            cp dist/*.ipa "$CM_EXPORT_DIR/"
            ls -lh "$CM_EXPORT_DIR/"*.ipa
          fi
      # A simulator failure must never block packaging a valid native IPA.
      # This separate compile gate catches Swift errors in the XCTest bundle.
      - name: Compile all XCTest sources without launching the simulator
        script: |
          set -euo pipefail
          xcodebuild -project BerryBlockBlast.xcodeproj \
            -scheme BerryBlockBlast \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO build-for-testing
      # Codemagic can hang before the XCTest runner connects, independent of
      # app correctness. This diagnostic uses the selected SDK's exact runtime.
      # Genuine test failures still fail CI; runner hangs are marked NOT VERIFIED.
      - name: Attempt XCTest on matching simulator with bounded timeout
        script: |
          set -euo pipefail
          python3 Tools/run_codemagic_simulator.py
    artifacts:
      # Artifact patterns resolve from the repository clone root.
      - $CM_BUILD_DIR/StrawberryShortcakeBlockBlast/dist/*.ipa
      - $CM_EXPORT_DIR/*.ipa
      - StrawberryShortcakeBlockBlast/dist/*.ipa
      - StrawberryShortcakeBlockBlast/dist/*.log
      - StrawberryShortcakeBlockBlast/dist/*.txt
      - StrawberryShortcakeBlockBlast/dist/*.xcresult
      - StrawberryShortcakeBlockBlast/build/Logs/Build/*.xcactivitylog
      - StrawberryShortcakeBlockBlast/build-simulator/Logs/Test/*.xcresult
