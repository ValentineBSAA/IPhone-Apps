name: BerryBlockBlast
options:
  bundleIdPrefix: com.valentinebsaa
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Berry Berry Blast"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UIStatusBarHidden: YES
    INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
    MARKETING_VERSION: "0.5.12"
    CURRENT_PROJECT_VERSION: "2"
    INFOPLIST_KEY_CFBundleShortVersionString: "0.5.12"
    INFOPLIST_KEY_CFBundleVersion: "2"
targets:
  BerryBlockBlast:
    type: application
    platform: iOS
    sources:
      - path: BerryBlockBlast
      # Verbatim 51 M4A + 16 WAV sources with separate resource catalogs.
      - path: AudioBuild2/Music
        type: folder
      - path: AudioBuild2/Effects
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valentinebsaa.berryblockblast
  BerryBlockBlastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BerryBlockBlast
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.valentinebsaa.berryblockblast.tests
schemes:
  BerryBlockBlast:
    build:
      targets:
        BerryBlockBlast: all
        BerryBlockBlastTests: [test]
    test:
      targets:
        - BerryBlockBlastTests
