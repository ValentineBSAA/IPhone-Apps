name: BerryBlockBlast
options:
  bundleIdPrefix: com.valentinebsaa
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Berry Berry Blast"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UIStatusBarHidden: YES
    INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
    MARKETING_VERSION: "0.5.16"
    CURRENT_PROJECT_VERSION: "46"
    INFOPLIST_KEY_CFBundleShortVersionString: "0.5.16"
    INFOPLIST_KEY_CFBundleVersion: "46"
targets:
  BerryBlockBlast:
    type: application
    platform: iOS
    sources:
      - path: BerryBlockBlast
      # Verbatim 51 M4A + 16 WAV sources with separate resource catalogs.
      - path: AudioBuild2/Music
        type: folder
      - path: AudioBuild2/Effects
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valentinebsaa.berryblockblast
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BERRY_INTERNAL_QA"
  BerryBlockBlastUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: BerryBlockBlast
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.valentinebsaa.berryblockblast.uitests
  BerryBlockBlastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BerryBlockBlast
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.valentinebsaa.berryblockblast.tests
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BERRY_INTERNAL_QA"
schemes:
  BerryBlockBlast:
    build:
      targets:
        BerryBlockBlast: all
        BerryBlockBlastTests: [test]
    test:
      targets:
        - BerryBlockBlastTests
  BerryBlockBlastUI:
    build:
      targets:
        BerryBlockBlast: all
        BerryBlockBlastUITests: [test]
    test:
      targets:
        - BerryBlockBlastUITests
