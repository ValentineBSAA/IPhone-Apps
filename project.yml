name: RepoPulse
options:
  bundleIdPrefix: com.valentinebsaa
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  RepoPulse:
    type: application
    platform: iOS
    sources:
      - path: RepoPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valentinebsaa.repopulse
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Repo Pulse"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        CODE_SIGN_STYLE: Automatic
