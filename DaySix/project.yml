name: DaySix
options:
  bundleIdPrefix: com.valentinebsaa
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
targets:
  DaySix:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valentinebsaa.daysix
        INFOPLIST_KEY_CFBundleDisplayName: DaySix
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    info:
      path: DaySix-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.valentinebsaa.daysix
            CFBundleURLSchemes: [daysix]
        LSApplicationQueriesSchemes: [sidestore]
        UIRequiresFullScreen: false
    scheme:
      testTargets: []
