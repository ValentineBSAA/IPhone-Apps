name: ChatGPTLegacy16
options:
  bundleIdPrefix: com.valentinebsaa
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  ChatGPTLegacy16:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valentinebsaa.chatgptlegacy16
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Chat Companion"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose images to attach to a conversation."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos to attach to a conversation."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Use audio features available in the ChatGPT website."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Use speech recognition when supported by the website."
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: []
