name: CrispCompanion
options:
  bundleIdPrefix: com.valentinebsaa
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CrispCompanion:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valentinebsaa.crispcompanion
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: CrispCompanion
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Crisp Companion"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Crisp Companion scans for your COSORI when requested; Bluetooth service inspection and idle-only notification observation briefly connect with your permission. Notifications configure a Bluetooth descriptor, but no cooking commands or Wi-Fi passwords are sent."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  CrispCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: CrispCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valentinebsaa.crispcompanion.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  CrispCompanion:
    build:
      targets:
        CrispCompanion: all
        CrispCompanionTests: [test]
    test:
      targets:
        - CrispCompanionTests
